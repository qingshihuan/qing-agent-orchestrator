name: Publish v0.5.0 now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.5.0-now.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release-v0.5.0-isolated-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_PROMPT_DISABLED: "1"
      TAG: v0.5.0
      VERSION: 0.5.0
      NOTES: docs/release-notes-v0.5.0.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report exact run URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 6 --body "Isolated v0.5.0 publisher started: $url (commit $env:GITHUB_SHA)."
          if ($LASTEXITCODE -ne 0) { Write-Warning "Run URL comment failed; continuing."; exit 0 }

      - name: Validate version, notes, changelog, assets, and checksums
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $lock = Get-Content -Raw package-lock.json | ConvertFrom-Json
          $runtime = Get-Content -Raw .agents/skills/qing-agent-orchestrator-full/runtime/package.json | ConvertFrom-Json
          $versions = @([string]$package.version, [string]$lock.version, [string]$lock.packages.''.version, [string]$runtime.version)
          if (@($versions | Where-Object { $_ -ne $env:VERSION }).Count -ne 0) {
            throw "Version metadata is not synchronized to $env:VERSION: $($versions -join ', ')"
          }
          if (-not (Test-Path -LiteralPath $env:NOTES -PathType Leaf)) { throw "Missing release notes: $env:NOTES" }
          if ((Get-Content -Raw CHANGELOG.md) -notmatch "(?m)^## $([regex]::Escape($env:VERSION)) - \d{4}-\d{2}-\d{2}$") {
            throw "CHANGELOG.md has no dated $env:VERSION section."
          }
          $expected = @("qing-agent-orchestrator-standard.zip", "qing-agent-orchestrator-full.zip")
          $manifest = @{}
          $lines = @(Get-Content artifacts/SHA256SUMS.txt)
          if ($lines.Count -ne 2) { throw "SHA256SUMS.txt must contain exactly two entries." }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9A-Fa-f]{64})  ([^\\/]+\.zip)$') { throw "Malformed checksum entry: $line" }
            if ($expected -notcontains $matches[2] -or $manifest.ContainsKey($matches[2])) { throw "Unexpected or duplicate asset: $($matches[2])" }
            $manifest[$matches[2]] = $matches[1].ToUpperInvariant()
          }
          foreach ($name in $expected) {
            $path = Join-Path artifacts $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release asset: $path" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $manifest[$name]) { throw "Checksum mismatch: $name" }
          }

      - name: Read current release state
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view $env:TAG --json isDraft,url 2>$null
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $value = $json | ConvertFrom-Json
            "exists=true" >> $env:GITHUB_OUTPUT
            "draft=$([string]$value.isDraft).ToLowerInvariant()" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            "draft=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTS: ${{ steps.release.outputs.exists }}
          DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          $title = "Qing-Agent-Orchestrator $env:TAG"
          if ($env:EXISTS -ne "true") {
            gh release create $env:TAG --target $env:GITHUB_SHA --title $title --notes-file $env:NOTES --draft
          } elseif ($env:DRAFT -eq "true") {
            gh release edit $env:TAG --target $env:GITHUB_SHA --title $title --notes-file $env:NOTES --draft
          } else {
            gh release edit $env:TAG --target $env:GITHUB_SHA --title $title --notes-file $env:NOTES
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or update $env:TAG." }
          gh release upload $env:TAG artifacts/qing-agent-orchestrator-standard.zip artifacts/qing-agent-orchestrator-full.zip artifacts/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload $env:TAG assets." }
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $env:TAG." }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:TAG --json tagName,isDraft,isLatest,url,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read back $env:TAG." }
          if ($release.tagName -ne $env:TAG -or $release.isDraft -or -not $release.isLatest) { throw "Published release state is invalid." }
          $expected = @("SHA256SUMS.txt", "qing-agent-orchestrator-full.zip", "qing-agent-orchestrator-standard.zip") | Sort-Object
          $actual = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (@(Compare-Object $expected $actual).Count -ne 0) { throw "Published release has the wrong asset set." }
          if (@($release.assets | Where-Object { [long]$_.size -le 0 }).Count -ne 0) { throw "A published asset is empty." }
          gh pr comment 6 --body "v0.5.0 was published and verified with all three assets: $($release.url)."
          if ($LASTEXITCODE -ne 0) { Write-Warning "Release succeeded; completion comment failed."; exit 0 }

name: Prepare GPT-6-only scheduling
on:
  push:
    branches: [codex/gpt6-only-scheduler-20260923]
    paths:
      - .github/maintenance/migrate-gpt6.py
      - .github/workflows/prepare-gpt6-scheduling.yml
permissions:
  contents: read
concurrency:
  group: prepare-gpt6-scheduling
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'qingshihuan/qing-agent-orchestrator' && github.actor == 'qingshihuan'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded migration
        run: python .github/maintenance/migrate-gpt6.py
      - name: Finish preset packaging and end-to-end adapter regressions
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('tests/task-router.test.ts')
          source=p.read_text(encoding='utf-8')
          assert source.count('desktop-terra-normal') == 1
          p.write_bytes(source.replace('desktop-terra-normal','desktop-sol-normal').encode('utf-8'))
          p=Path('scripts/package-skill-editions.ps1')
          source=p.read_text(encoding='utf-8')
          anchor='$standardZip = Join-Path $artifactsRoot "qing-agent-orchestrator-standard.zip"'
          assert source.count(anchor)==1
          addition='''# Ship an explicit GPT-6 preset separately; never overwrite relay.user.json.
          $gpt6Preset = [System.IO.File]::ReadAllText((Join-Path $projectRoot "config/relay.example.json"))
          $gpt6Preset = $gpt6Preset.Replace("`r`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText((Join-Path $runtimeRoot "config/relay.gpt6.json"), $gpt6Preset, [System.Text.UTF8Encoding]::new($false))

          '''
          source=source.replace(anchor,addition+anchor)
          expected='      "runtime/config/relay.user.json"'
          assert source.count(expected)==1
          source=source.replace(expected, expected+'\n      "runtime/config/relay.gpt6.json"')
          mapping='      elseif ($relativePath.StartsWith("runtime/schemas/")) {'
          assert source.count(mapping)==1
          source=source.replace(mapping, '''      elseif ($relativePath -eq "runtime/config/relay.gpt6.json") {
                  Join-Path $projectRoot "config/relay.example.json"
                }
          '''+mapping)
          p.write_bytes(source.encode('utf-8'))
          preset=Path('.agents/skills/qing-agent-orchestrator-full/runtime/config/relay.gpt6.json')
          preset.write_bytes(Path('config/relay.example.json').read_bytes())
          parsed=json.loads(preset.read_text(encoding='utf-8'))
          assert parsed['executor']['mode']=='dry-run'
          assert parsed['executor']['codexExec']['enabled'] is False
          assert parsed['security']['approvedGateIds']==[]
          assert {c['model'] for c in parsed['modelRouting']['candidates']}=={'gpt-6-luna','gpt-6-sol','gpt-6-astra'}
          p=Path('tests/codex-exec-executor.test.ts')
          extra='''
          test("runtime rejection lazily prepares an unverified fallback and preserves process scope", async () => {
            const handoff = await exampleHandoff();
            const selection = selectedModelWithFallback();
            selection.fallbackPlan.orderedCandidates[1]!.observedState = "unverified";
            const runner = new FakeCodexRunner(handoff, true, false, [processResult({exitCode:1,stderr:"unknown model gpt-6-sol"})]);
            let preparations = 0;
            const executor = new CodexExecExecutor({ ...options(), modelSelection: selection,
              prepareModelFallback: async (current, reason) => {
                preparations++;
                assert.match(reason,/gpt-6-sol/);
                assert.equal(current.fallbackPlan.orderedCandidates[1]!.observedState,"unverified");
                return { ...current, fallbackPlan: { ...current.fallbackPlan, orderedCandidates: current.fallbackPlan.orderedCandidates.map((c,i)=>i===1?{...c,observedState:"healthy" as const}:c) } };
              },
            }, runner);
            const result = await executor.execute(handoff,{iteration:1,revisionInstructions:[]});
            assert.equal(result.status,"succeeded");
            assert.equal(preparations,1);
            assert.equal(executor.finalModelSelection?.model,"gpt-6-astra");
            const attempts = runner.requests.filter(r=>r.args[0]==="exec");
            assert.equal(attempts.length,2);
            assert.equal(attempts[0]!.stdin,attempts[1]!.stdin);
            assert.deepEqual(argsWithoutModelPair(attempts[0]!.args),argsWithoutModelPair(attempts[1]!.args));
            assert.equal(result.modelFallbackAudit?.gateAssessment.requiresNewGate,false);
          });
          test("cancellation with zero exit and valid output still fails without probing backups", async () => {
            const handoff = await exampleHandoff();
            const runner = new FakeCodexRunner(handoff,true,false,[processResult({cancelled:true,stdout:'{"type":"turn.completed"}'})]);
            let preparations=0;
            const executor = new CodexExecExecutor({...options(),modelSelection:selectedModelWithFallback(),prepareModelFallback:async current=>{preparations++;return current;}},runner);
            const result=await executor.execute(handoff,{iteration:1,revisionInstructions:[]});
            assert.equal(result.status,"failed");
            assert.match(result.summary,/cancelled/);
            assert.equal(preparations,0);
            assert.equal(runner.requests.filter(r=>r.args[0]==="exec").length,1);
          });
          test("ordinary failure and timeout never trigger lazy model preflight", async () => {
            const handoff=await exampleHandoff();
            for(const failure of [processResult({exitCode:1,stderr:"ordinary task error"}),processResult({exitCode:null,timedOut:true})]) {
              const runner=new FakeCodexRunner(handoff,true,false,[failure]);
              let preparations=0;
              const result=await new CodexExecExecutor({...options(),modelSelection:selectedModelWithFallback(),prepareModelFallback:async current=>{preparations++;return current;}},runner).execute(handoff,{iteration:1,revisionInstructions:[]});
              assert.equal(result.status,"failed");
              assert.equal(preparations,0);
              assert.equal(runner.requests.filter(r=>r.args[0]==="exec").length,1);
            }
          });
          '''
          p.write_bytes((p.read_text(encoding='utf-8')+'\n'+extra).encode('utf-8'))
          p=Path('docs/release-notes-v0.10.0.md')
          p.write_bytes((p.read_text(encoding='utf-8')+'\n完整版 ZIP 额外附带 `runtime/config/relay.gpt6.json` 三模型预设，默认关闭真实执行；这是独立可选配置，不覆盖 `relay.user.json`。\n').encode('utf-8'))
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Run complete regression suite
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm test *> "$env:RUNNER_TEMP/gpt6-tests.log"
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Select-String -Path "$env:RUNNER_TEMP/gpt6-tests.log" -Pattern '^not ok' -Context 1,45
            Get-Content "$env:RUNNER_TEMP/gpt6-tests.log" -Tail 15
            throw 'Complete regression suite failed; changes are not published.'
          }
          Get-Content "$env:RUNNER_TEMP/gpt6-tests.log" -Tail 12
      - name: Measure deterministic scheduling requests
        run: node scripts/measure-gpt6-scheduling.mjs
      - name: Rebuild and validate both skill archives
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/gpt6-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify three-model policy inside generated runtime
        shell: pwsh
        run: |
          node --input-type=module -e "import { supportedTaskModels, supportedReasoningEfforts } from './.agents/skills/qing-agent-orchestrator-full/runtime/dist/src/model-router.js'; import assert from 'node:assert/strict'; assert.deepEqual([...supportedTaskModels].sort(), ['gpt-6-astra','gpt-6-luna','gpt-6-sol']); for (const backend of ['codex-cli','desktop-child']) assert.deepEqual(supportedReasoningEfforts(backend,'gpt-5.6-sol'),[]); console.log('Generated runtime has exactly the three GPT-6 task models.');"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged model policy check failed' }
      - name: Commit validated source and bundles to the preparation branch only
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -ne 'codex/gpt6-only-scheduler-20260923') { throw 'Unexpected branch' }
          git add -- src tests examples schemas config/relay.example.json .agents/skills artifacts package.json package-lock.json docs README.md README.en.md CHANGELOG.md scripts/measure-gpt6-scheduling.mjs scripts/package-skill-editions.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git rm -- .github/maintenance/migrate-gpt6.py .github/workflows/prepare-gpt6-scheduling.yml
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance helper removal failed' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use only GPT-6 models and share lazy task scheduling; prepare v0.10.0'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Branch moved or push failed; no force push permitted' }

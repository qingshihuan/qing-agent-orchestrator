name: Prepare v0.5.0 release

on:
  push:
    branches:
      - release/v0.5.0

permissions:
  contents: write

concurrency:
  group: prepare-v0.5.0
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'qingshihuan/qing-agent-orchestrator' &&
      github.ref == 'refs/heads/release/v0.5.0' &&
      !contains(github.event.head_commit.message, '[release-prep]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update versioned source and documentation
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          VERSION = "0.5.0"
          PREVIOUS = "0.4.0"
          RELEASE_DATE = "2026-08-24"

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8", newline="\n")

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return value.replace(old, new, 1)

          def replace_regex_once(value: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, value, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one regex match, found {count}")
              return updated

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if package.get("version") != PREVIOUS:
              raise RuntimeError(f"package.json expected {PREVIOUS}, found {package.get('version')}")
          package["version"] = VERSION
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          if lock.get("version") != PREVIOUS or lock.get("packages", {}).get("", {}).get("version") != PREVIOUS:
              raise RuntimeError("package-lock.json is not at the expected previous version")
          lock["version"] = VERSION
          lock["packages"][""]["version"] = VERSION
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")

          changelog = read("CHANGELOG.md")
          changelog = replace_once(
              changelog,
              "本项目采用语义化版本编号。当前发布候选版本为 `v0.4.0`；`v0.3.0` 的历史记录与本地标签语义保持不变。",
              "本项目采用语义化版本编号。当前稳定版本为 `v0.5.0`；既有版本的历史记录与标签语义保持不变。",
              "CHANGELOG current version",
          )
          changelog_section = f'''\n## {VERSION} - {RELEASE_DATE}\n\n### Added\n\n- 运行时解析当前安装的 `codex debug models --bundled` 输出，以真实模型 slug、`supported_reasoning_levels` 和 `minimal_client_version` 作为 CLI 能力来源。\n- Windows / Ubuntu、Node.js 18 / 22 的四平台 CI 矩阵，以及独立的 Skill 打包、解压内容和 SHA-256 验证门禁。\n- 可复用的 ZIP 语义比较脚本：按解压后的精确文件集合和逐文件哈希判断产物一致性，不受 ZIP 时间戳影响。\n- 自动化 GitHub Release 工作流：从同步版本号、Changelog 和发布说明构建、复验并发布标准版、完整版和校验清单。\n\n### Changed\n\n- CLI 配置层允许表达 `minimal|low|medium|high|xhigh|max|ultra`；某个组合是否可用由当前 Codex 目录和账户健康探针共同决定，不再由仓库静态模型表决定。\n- CLI 候选在进入健康状态前必须依次通过目录能力验证和受限、只读、结构化 entitlement 探针。\n- 完整版编译 runtime、两个可安装 ZIP 与 `SHA256SUMS.txt` 纳入持续漂移检查。\n\n### Fixed\n\n- 修复 Windows GitHub Runner 的 8.3 短路径别名导致同一临时目录被当作不同路径的问题。\n- 修复 wildcard `allowedPaths` 可让另一平台格式的绝对路径或 UNC 路径绕过边界检查的问题。\n- 修复源码已更新但完整 Skill runtime、ZIP 或校验清单仍停留在旧实现的发布风险。\n\n### Safety\n\n- POSIX 绝对路径、Windows 盘符路径、UNC 路径和父目录穿越均在 wildcard 匹配前失败关闭。\n- 缺失目录、目录格式异常、模型不存在、推理强度不支持、最低客户端版本不满足或账户探针失败时，真实 `codex exec` 不会启动。\n- 跨后端或安全范围变化仍要求新的 gate；本版本没有放宽既有审批边界。\n\n### Evidence boundary\n\n- 源码、四平台测试、Skill 打包、归档内容和哈希由 CI 与 Release 工作流独立复验。\n- 发布流程不会把受控 fake-runner 或目录解析结果表述为某个账户的 connected CLI 成功；目标安装仍须通过实际 entitlement 探针。\n'''
          changelog = replace_once(
              changelog,
              "\n## 0.4.0 - 2026-08-20\n",
              changelog_section + "\n## 0.4.0 - 2026-08-20\n",
              "CHANGELOG insertion",
          )
          write("CHANGELOG.md", changelog)

          readme = read("README.md")
          readme = replace_once(
              readme,
              "[v0.4.0 发布说明](docs/release-notes-v0.4.0.md)",
              "[v0.5.0 发布说明](docs/release-notes-v0.5.0.md)",
              "README release link",
          )
          readme = replace_regex_once(
              readme,
              r"模型候选明确绑定 `desktop-child` 或 `codex-cli`。.*?\n\n这些可用性是当前 host/文档快照",
              """模型候选明确绑定 `desktop-child` 或 `codex-cli`。桌面候选继续以宿主公布的能力快照为准，内部子任务实际接收 `{ model, reasoning_effort }`，显式值只作用于委派后端，不改变父任务模型。CLI 路径实际接收 `-m` 和 `model_reasoning_effort`；配置层可以表达 `minimal|low|medium|high|xhigh|max|ultra`，但当前安装的 `codex debug models --bundled` 目录才是模型、推理强度和最低客户端版本的权威来源。CLI 候选还必须通过受限、只读、结构化的账户 entitlement 探针，目录有效但账户不可用的组合不会进入健康状态。\n\n这些可用性是当前 host/运行时快照""",
              "README model capability paragraph",
          )
          readme = replace_regex_once(
              readme,
              r"## v0\.4\.0 发布重点\n.*?\n## 工作流",
              """## v0.5.0 发布重点

- **安装目录即权威能力源：** CLI 模型 slug、推理强度和最低客户端版本来自当前安装的 Codex bundled catalog，不再依赖仓库静态表。
- **双层健康验证：** 目录能力验证通过后，仍需通过只读结构化 entitlement 探针；任一层失败都不会启动真实执行。
- **跨平台路径失败关闭：** wildcard 不再放行 POSIX、Windows、UNC 绝对路径或父目录穿越。
- **四平台持续验证：** Windows / Ubuntu × Node.js 18 / 22 均执行 typecheck 和完整测试套件。
- **发布产物可证明：** 完整 Skill runtime、标准/完整 ZIP、逐文件内容和 SHA-256 都由 CI 与 Release 工作流复验。

## 工作流""",
              "README highlights",
          )
          readme = replace_regex_once(
              readme,
              r"## 当前能力边界\n.*?\n## 开发与验证",
              """## 当前能力边界

`v0.5.0` 包含：

- 桌面标准版与桌面优先完整版；
- Task / Execution Mode Router，以及向真实委派参数落地的 Model Router；
- 基于当前 Codex bundled catalog 的 CLI 模型、推理强度和最低客户端版本验证；
- 目录验证之后的受限只读 entitlement 健康探针；
- 唯一的 `executionOwner: ChatGPT | Codex` 高层归属合同；
- completion-first 显式同后端模型回退、高风险同范围 gate 复用和失败关闭分类；
- 跨平台绝对路径、UNC 路径和父目录穿越防护；
- Handoff、Executor Result、Review 和证据 Schema；
- Safety Gate、Relay、RunStore、规则 Reviewer 与 `status/logs/cancel` 控制面；
- 默认关闭的真实 `codex exec` 适配器；
- 四平台 CI、完整 runtime 漂移检测和经过逐文件内容验证的两个可安装 ZIP；
- 自动构建、复验、打标签并上传三个发布附件的 GitHub Release 流程。

不包含或尚未证明：

- OpenAI API / Codex SDK 程序级双 Agent 适配器；
- 原生审批按钮；
- 常驻跨进程服务队列；
- 用户可见的独立模型选择器；
- 真实 CLI 写入 E2E；
- 对任意账户的具体模型 entitlement 保证。

SDK/API 集成会作为后续可选分支，不改变面向大多数订阅用户的桌面优先主线。详见[路线图](docs/roadmap.md)。

本版本新增的是可验证的运行时目录、版本、账户预检和发布链路，不把目录解析或 fake-runner 测试当作新的 connected CLI 成功。具体账户仍须在目标安装中通过真实健康探针。详见 [v0.5.0 发布说明](docs/release-notes-v0.5.0.md)。历史说明继续保留在 [v0.4.0 发布说明](docs/release-notes-v0.4.0.md) 与 [v0.3.0 发布说明](docs/release-notes-v0.3.0.md)。

## 开发与验证""",
              "README current boundary",
          )
          write("README.md", readme)

          readme_en = read("README.en.md")
          readme_en = replace_once(
              readme_en,
              "[v0.4.0 release notes](docs/release-notes-v0.4.0.md)",
              "[v0.5.0 release notes](docs/release-notes-v0.5.0.md)",
              "README.en release link",
          )
          readme_en = replace_regex_once(
              readme_en,
              r"Every candidate is bound to `desktop-child` or `codex-cli`\..*?\n\nAvailability is a current host/documentation snapshot",
              """Every candidate is bound to `desktop-child` or `codex-cli`. Desktop candidates continue to use the capability snapshot advertised by the host. An internal child receives `{ model, reasoning_effort }`; explicit values affect only the delegated backend and never change the parent model. The CLI receives `-m` and `model_reasoning_effort`. Configuration may express `minimal|low|medium|high|xhigh|max|ultra`, but the installed `codex debug models --bundled` catalog is authoritative for model slugs, reasoning levels, and minimum client versions. A CLI candidate must also pass a bounded, read-only, structured account-entitlement probe, so a catalog-valid but account-unavailable pair never becomes healthy.\n\nAvailability is a current host/runtime snapshot""",
              "README.en model capability paragraph",
          )
          readme_en = replace_regex_once(
              readme_en,
              r"## v0\.4\.0 highlights\n.*?\n## Workflow",
              """## v0.5.0 highlights

- **The installed catalog is authoritative:** CLI model slugs, reasoning levels, and minimum client versions come from the current Codex bundled catalog rather than a permanent repository table.
- **Two-layer health validation:** a catalog-valid pair must still pass a bounded read-only entitlement probe before real execution can start.
- **Cross-platform path fail-closure:** wildcards no longer admit POSIX, Windows, UNC absolute paths, or parent traversal.
- **Four-platform continuous verification:** Windows and Ubuntu on Node.js 18 and 22 run typechecking and the complete test suite.
- **Provable release artifacts:** the Full runtime, both ZIPs, extracted per-file contents, and SHA-256 manifests are independently checked by CI and the release workflow.

## Workflow""",
              "README.en highlights",
          )
          readme_en = replace_regex_once(
              readme_en,
              r"## Current boundary\n.*?\n## Development",
              """## Current boundary

`v0.5.0` includes both editions; task and execution-mode routing; delegated model routing; installed Codex catalog validation for CLI model slugs, reasoning levels, and minimum client versions; the subsequent bounded entitlement probe; the sole `executionOwner: ChatGPT | Codex` contract; completion-first explicit same-backend fallback; same-scope high-risk gate reuse; fail-closed rejection classification; cross-platform absolute-path and traversal protection; structured contracts; Relay, RunStore, rule-based review, and the observable control plane; the disabled-by-default real `codex exec` adapter; four-platform CI; generated-runtime drift detection; content-verified installable archives; and an automated GitHub Release pipeline.

It still does not include an OpenAI API / Codex SDK dual-agent adapter, native approval buttons, a persistent cross-process service queue, a separate user-visible model picker, a connected CLI write E2E, or a guarantee that any particular account is entitled to a specific model pair. SDK/API integration remains an optional future branch and will not replace the desktop-first mainline. See the [roadmap](docs/roadmap.md).

This release adds verifiable runtime-catalog, client-version, account-preflight, and publication layers. It does not treat catalog parsing or controlled fake-runner tests as a new connected CLI success; the target installation must still pass its real health probe. See the [v0.5.0 release notes](docs/release-notes-v0.5.0.md). Historical details remain in the [v0.4.0](docs/release-notes-v0.4.0.md) and [v0.3.0](docs/release-notes-v0.3.0.md) notes.

## Development""",
              "README.en current boundary",
          )
          write("README.en.md", readme_en)

          release_notes = f'''# 青-Agent-Orchestrator v{VERSION}

发布日期：{RELEASE_DATE}

v{VERSION} 把 CLI 模型路由从仓库静态能力表升级为“当前安装目录 + 最低客户端版本 + 账户健康探针”的运行时验证，并补齐跨平台路径安全、四平台 CI、完整 Skill runtime 漂移检查和可复验的 GitHub Release 链路。

## 发布重点

- **运行时 Codex 目录：** 调用 `codex debug models --bundled`，读取真实模型 slug、`supported_reasoning_levels` 和 `minimal_client_version`。
- **双层健康验证：** 目录能力通过后，再执行受限、只读、结构化的 entitlement 探针；任一层失败都不会进入真实 `codex exec`。
- **未来推理档位可表达：** 配置允许 `minimal|low|medium|high|xhigh|max|ultra`，但只接受当前目录明确支持的 model/effort 组合。
- **路径边界加固：** POSIX 绝对路径、Windows 盘符路径、UNC 路径和父目录穿越在 wildcard 匹配之前即被拒绝。
- **跨平台 CI：** Ubuntu 与 Windows、Node.js 18 与 22 的四个组合均执行 typecheck 和完整测试。
- **发布产物防漂移：** 完整版 runtime、标准版/完整版 ZIP、解压文件集合、逐文件 SHA-256 和 manifest 均被复验。
- **自动正式发布：** 合并版本提交后，Release 工作流重新测试、打包、验证，创建 `v{VERSION}` 标签并上传三个附件。

## 安全与兼容性

- 本版本没有放宽 Handoff、operation gate、same-backend fallback 或高风险 scope proof 的要求。
- 目录缺失、输出格式错误、模型不存在、推理档位不支持、最低客户端版本不足或账户预检失败时均失败关闭。
- Windows 8.3 短路径别名不再使同一临时目录产生错误的路径身份。
- ZIP 比较按解压内容进行，因此不会把归档时间戳差异误报为功能漂移。

## 验证与证据边界

正式 Release 只有在以下步骤全部成功后才发布：

1. `npm ci --ignore-scripts`；
2. TypeScript typecheck；
3. 完整测试套件；
4. Standard / Full Skill 打包与内部结构验证；
5. 已提交归档与新构建归档的逐文件内容比较；
6. `SHA256SUMS.txt` 复算；
7. 完整版 runtime 语义漂移检查。

这些证据证明代码、打包和发布链路。它们不保证任意账户拥有某个具体 CLI 模型；目标安装仍须通过真实目录和 entitlement 探针。本版本不声称新的 connected CLI 写入 E2E。

## 升级

从 Release 下载并覆盖对应技能目录：

- `qing-agent-orchestrator-standard.zip`
- `qing-agent-orchestrator-full.zip`

覆盖前保留你的用户配置；完整版的真实 CLI 执行仍默认关闭，并继续需要明确审批。

## 发布附件

- `qing-agent-orchestrator-standard.zip`
- `qing-agent-orchestrator-full.zip`
- `SHA256SUMS.txt`

---

## English

Release date: {RELEASE_DATE}

v{VERSION} replaces the permanent repository-side CLI capability table with runtime validation against the installed Codex catalog, minimum client versions, and a bounded account health probe. It also completes cross-platform path hardening, four-platform CI, generated Full-runtime drift checks, and a reproducible GitHub Release pipeline.

### Highlights

- **Installed Codex catalog:** read real model slugs, `supported_reasoning_levels`, and `minimal_client_version` from `codex debug models --bundled`.
- **Two-layer health validation:** a catalog-valid pair must also pass a bounded, read-only, structured entitlement probe before real `codex exec` may start.
- **Future-safe effort tokens:** configuration can express `minimal|low|medium|high|xhigh|max|ultra`, while the installed catalog remains authoritative for each pair.
- **Path boundary hardening:** POSIX absolute paths, Windows drive paths, UNC paths, and parent traversal fail before wildcard matching.
- **Cross-platform CI:** Ubuntu and Windows on Node.js 18 and 22 all run typechecking and the complete test suite.
- **Artifact drift prevention:** the Full runtime, Standard/Full ZIPs, extracted file inventories, per-file SHA-256 values, and manifests are verified.
- **Automated publication:** after the version commit reaches `main`, the Release workflow retests, rebuilds, validates, creates tag `v{VERSION}`, and uploads all three assets.

### Safety and compatibility

- This release does not relax Handoff approval, operation gates, same-backend fallback, or high-risk scope proof.
- A missing or malformed catalog, absent model, unsupported effort, insufficient client version, or failed account probe fails closed.
- Windows 8.3 path aliases no longer give the same temporary directory conflicting identities.
- ZIP comparison uses extracted content, so archive timestamps are not mistaken for semantic drift.

### Validation and evidence boundary

A published Release must pass dependency installation, TypeScript typechecking, the full test suite, both Skill package validations, committed-versus-generated extracted-content comparison, checksum recomputation, and Full-runtime semantic drift detection.

Those checks prove the source, packaging, and publication chain. They do not guarantee that a particular account is entitled to a specific CLI model; the target installation must still pass its real catalog and entitlement probe. This release does not claim a new connected CLI write E2E.

### Upgrade

Download the matching archive and replace the corresponding skill directory while preserving user configuration. Real CLI execution in the Full edition remains disabled by default and still requires explicit approval.

### Assets

- `qing-agent-orchestrator-standard.zip`
- `qing-agent-orchestrator-full.zip`
- `SHA256SUMS.txt`
'''
          write(f"docs/release-notes-v{VERSION}.md", release_notes)

          for path in ("README.md", "README.en.md", "CHANGELOG.md", f"docs/release-notes-v{VERSION}.md"):
              if "\r" in read(path):
                  raise RuntimeError(f"{path} contains CR characters after normalization")
          '@ | python -

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm run typecheck
          npm test

      - name: Build and validate release packages
        shell: pwsh
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/prepare-${{ github.run_id }}"

      - name: Verify synchronized versions
        shell: pwsh
        run: |
          $root = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $lock = Get-Content -Raw package-lock.json | ConvertFrom-Json
          $runtime = (Get-Content -Raw .agents/skills/qing-agent-orchestrator-full/runtime/package.json | ConvertFrom-Json).version
          if ($root -ne '0.5.0' -or $lock.version -ne $root -or $lock.packages.''.version -ne $root -or $runtime -ne $root) {
            throw "Release versions are not synchronized."
          }

      - name: Commit prepared release
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json CHANGELOG.md README.md README.en.md docs/release-notes-v0.5.0.md .agents/skills/qing-agent-orchestrator-full/runtime artifacts
          if (git diff --cached --quiet) {
            Write-Host "Release files are already prepared."
            exit 0
          }
          git commit -m "release: prepare v0.5.0 [release-prep]"
          git push origin HEAD:release/v0.5.0

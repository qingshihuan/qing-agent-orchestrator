name: Apply v0.7 efficiency upgrade

on:
  push:
    branches:
      - feature/v0.7.0-efficiency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-efficiency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize the v0.6.1 routing baseline for the one-shot transformer
        shell: pwsh
        run: |
          $path = "src/task-router.ts"
          $text = Get-Content -LiteralPath $path -Raw
          $current = 'if (hasDeleteEffect(effective)) signals.push("delete-action");'
          $baseline = 'if (deleteVerb.test(effective) && (destructiveTarget.test(effective) || pathLikeTarget.test(effective)) && !codeSymbolTarget.test(effective)) signals.push("delete-action");'
          if ($text.Contains($current)) {
            $text = $text.Replace($current, $baseline)
            Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM -NoNewline
          }
      - name: Apply source transformations
        run: python scripts/apply-v0.7-efficiency.py
      - name: Repair generated TypeScript compatibility defects
        shell: pwsh
        run: |
          $healthPath = "src/model-health.ts"
          $healthText = Get-Content -LiteralPath $healthPath -Raw
          $newlinePattern = 'await writeFile\(temporary, JSON\.stringify\(\{ version: "1\.0", records \}, null, 2\) \+ "\s*", "utf8"\);'
          $newlineReplacement = 'await writeFile(temporary, JSON.stringify({ version: "1.0", records }, null, 2) + "\n", "utf8");'
          $fixedHealth = [regex]::Replace($healthText, $newlinePattern, $newlineReplacement, 1)
          if ($fixedHealth -eq $healthText) { throw "The generated model-health newline defect was not found." }
          Set-Content -LiteralPath $healthPath -Value $fixedHealth -Encoding utf8NoBOM -NoNewline

          $cliPath = "src/cli.ts"
          $cliText = Get-Content -LiteralPath $cliPath -Raw
          $routeCurrent = 'candidate.routes.includes(decision.route)'
          $routeReplacement = 'candidate.routes.includes(decision.route as "codex" | "hybrid")'
          if (-not $cliText.Contains($routeCurrent)) { throw "The generated route narrowing expression was not found." }
          $cliText = $cliText.Replace($routeCurrent, $routeReplacement)
          Set-Content -LiteralPath $cliPath -Value $cliText -Encoding utf8NoBOM -NoNewline
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Run full tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm test
      - run: npm run build
      - name: Run three-size efficiency benchmark
        run: node scripts/benchmark-efficiency.mjs
      - name: Rebuild and validate installable skill archives
        shell: pwsh
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/v0.7-${{ github.run_id }}"
      - name: Remove one-shot machinery
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".github/workflows/export-v0.7-source.yml" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ".github/workflows/apply-v0.7-efficiency.yml" -Force
          Remove-Item -LiteralPath "scripts/apply-v0.7-efficiency.py" -Force
      - name: Commit validated v0.7 tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat: v0.7.0 efficiency-first orchestration"
            git push origin HEAD:feature/v0.7.0-efficiency
          }

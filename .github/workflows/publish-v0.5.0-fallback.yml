name: Publish v0.5.0 fallback

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.5.0-fallback.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Share the normal Release workflow's evaluated concurrency group so the two
# publishers cannot mutate the same release simultaneously.
concurrency:
  group: release-refs/heads/main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_PROMPT_DISABLED: "1"
      TAG: v0.5.0
      VERSION: 0.5.0
      NOTES: docs/release-notes-v0.5.0.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report publisher run URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh pr comment 6 --body "Fallback publisher started: $runUrl (commit $env:GITHUB_SHA)."
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not post the diagnostic run URL; publication will continue."
            exit 0
          }

      - name: Validate release metadata and committed artifacts
        shell: pwsh
        run: |
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $lock = Get-Content -Raw -LiteralPath package-lock.json | ConvertFrom-Json
          $runtime = Get-Content -Raw -LiteralPath .agents/skills/qing-agent-orchestrator-full/runtime/package.json | ConvertFrom-Json
          foreach ($actual in @(
            [string]$package.version,
            [string]$lock.version,
            [string]$lock.packages.''.version,
            [string]$runtime.version
          )) {
            if ($actual -ne $env:VERSION) {
              throw "Release version mismatch: expected $env:VERSION, found $actual."
            }
          }
          if (-not (Test-Path -LiteralPath $env:NOTES -PathType Leaf)) {
            throw "Release notes are missing: $env:NOTES"
          }
          $changelog = Get-Content -Raw -LiteralPath CHANGELOG.md
          if ($changelog -notmatch "(?m)^## $([regex]::Escape($env:VERSION)) - \d{4}-\d{2}-\d{2}$") {
            throw "CHANGELOG.md has no dated section for $env:VERSION."
          }

          $expectedNames = @(
            "qing-agent-orchestrator-standard.zip",
            "qing-agent-orchestrator-full.zip"
          )
          $manifestPath = "artifacts/SHA256SUMS.txt"
          $manifest = @{}
          $lines = @(Get-Content -LiteralPath $manifestPath)
          if ($lines.Count -ne $expectedNames.Count) {
            throw "SHA256SUMS.txt must contain exactly two entries."
          }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9A-Fa-f]{64})  ([^\\/]+\.zip)$') {
              throw "Malformed checksum entry: $line"
            }
            $name = $matches[2]
            if ($expectedNames -notcontains $name -or $manifest.ContainsKey($name)) {
              throw "Unexpected or duplicate checksum entry: $name"
            }
            $manifest[$name] = $matches[1].ToUpperInvariant()
          }
          foreach ($name in $expectedNames) {
            $path = Join-Path artifacts $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release asset is missing: $path"
            }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actualHash -ne $manifest[$name]) {
              throw "Checksum mismatch for $name."
            }
          }

      - name: Inspect existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view $env:TAG --json isDraft,url 2>$null
          $viewExitCode = $LASTEXITCODE
          if ($viewExitCode -eq 0) {
            $release = $json | ConvertFrom-Json
            "exists=true" >> $env:GITHUB_OUTPUT
            "draft=$([string]$release.isDraft).ToLowerInvariant()" >> $env:GITHUB_OUTPUT
            "url=$($release.url)" >> $env:GITHUB_OUTPUT
          }
          else {
            "exists=false" >> $env:GITHUB_OUTPUT
            "draft=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Create or update release metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          DRAFT: ${{ steps.existing.outputs.draft }}
        run: |
          $title = "Qing-Agent-Orchestrator $env:TAG"
          if ($env:EXISTS -ne "true") {
            gh release create $env:TAG --target $env:GITHUB_SHA --title $title --notes-file $env:NOTES --draft
          }
          elseif ($env:DRAFT -eq "true") {
            gh release edit $env:TAG --title $title --notes-file $env:NOTES --target $env:GITHUB_SHA --draft
          }
          else {
            gh release edit $env:TAG --title $title --notes-file $env:NOTES --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update $env:TAG."
          }

      - name: Upload verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG `
            artifacts/qing-agent-orchestrator-standard.zip `
            artifacts/qing-agent-orchestrator-full.zip `
            artifacts/SHA256SUMS.txt `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for $env:TAG."
          }

      - name: Publish and mark latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish $env:TAG."
          }

      - name: Verify published release and exact asset set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:TAG --json tagName,isDraft,isLatest,url,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Published release $env:TAG could not be read back."
          }
          if ($release.tagName -ne $env:TAG -or $release.isDraft -ne $false -or $release.isLatest -ne $true) {
            throw "Release state verification failed for $env:TAG."
          }
          $expected = @(
            "SHA256SUMS.txt",
            "qing-agent-orchestrator-full.zip",
            "qing-agent-orchestrator-standard.zip"
          ) | Sort-Object
          $actual = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count -ne 0) {
            throw "Release asset set mismatch: $($difference | ConvertTo-Json -Compress)"
          }
          foreach ($asset in $release.assets) {
            if ([long]$asset.size -le 0) {
              throw "Release asset is empty: $($asset.name)"
            }
          }
          Write-Host "Published $($release.url) from $($release.targetCommitish) with all verified assets."
          gh pr comment 6 --body "Fallback publisher verified the published release and exact asset set: $($release.url)."
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release succeeded, but the completion comment could not be posted."
            exit 0
          }

name: Finalize Astra and context efficiency
on:
  push:
    branches: [codex/astra-efficiency-v0.9.0]
    paths: [.github/workflows/finalize-astra-efficiency.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'qingshihuan/qing-agent-orchestrator' && github.actor == 'qingshihuan'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed transformations and restore explicit schema contracts
        shell: python
        run: |
          import pathlib, subprocess, textwrap
          baseline = 'b7317374fca396ec1f4959d1f250c876416cd49a'
          helpers = {'.github/workflows/prepare-astra-efficiency.yml', '.github/workflows/finalize-astra-efficiency.yml'}
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed = set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          assert changed == helpers, f'Unexpected baseline changes: {changed}'
          path = '.github/workflows/prepare-astra-efficiency.yml'
          assert subprocess.check_output(['git','hash-object','--',path],text=True).strip() == '3fa961ce87f261127ab6dae588c7f43e8d708445'
          source = pathlib.Path(path).read_text(encoding='utf-8')
          start = '      - name: Apply scoped source, instruction and regression changes\n        shell: python\n        run: |\n'
          code = textwrap.dedent(source.split(start,1)[1].split('      - run: npm ci --ignore-scripts',1)[0])
          old = "assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == baseline"
          assert code.count(old) == 1
          code = code.replace(old, "subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, 'HEAD'], check=True)")
          exec(compile(code, 'reviewed-astra-transformations', 'exec'), {})
          common = '''# Qing

          Reclassify the remaining phase each user turn and before delegation, revision or review:
          - Direct: safe single-scope work stays with the parent; zero children, no model allocation or Handoff approval.
          - Lite: one Executor, targeted parent verification, at most one revision.
          - Full: high-risk effects, cross-system work, real parallelism, release/deploy or explicit Full/Level 3; structured Handoff and independent Reviewer, two children and one revision by default. Only explicit bounded configuration overrides these limits.

          De-escalate as work narrows. Retain pending independent-review obligations for unaccepted high-risk artifacts; restore Full at final acceptance. PARENT_ACTION_REQUIRED and PARENT_VERIFICATION_REQUIRED are not completion; never fabricate a Review.

          ## Conditional references
          For clear Direct/Lite, do not preload references or schemas. Ambiguous routing or Full loads [orchestrator-spec.md](references/orchestrator-spec.md). Destructive, external, secret, global/system or uncertain effects require [safety-gates.md](references/safety-gates.md) and exact approvals before acting. Reversible in-scope edits/builds/tests need no plan approval. Preserve unrelated work; re-gate changed effects or scope.
          Full also loads [handoff-protocol.md](references/handoff-protocol.md), [reviewer-rules.md](references/reviewer-rules.md), SCHEMA_LINKS. Never skip required review or verification to save tokens.

          ## Context and work budget
          Delegate only useful separate work, never duplicate exploration. Send objective, relevant file ranges, constraints, acceptance criteria and tests, not the full conversation/repository. Revisions send unresolved findings and changed facts while retaining the safety contract. Reuse verification only for the same unchanged inputs, commands and environment; retest affected changes and run required full checks before release.
          Astra is opt-in for demanding work, not Direct/Lite's default. Choose an adequate capability-valid pair; verify current host model/effort availability. Use high for an initial demanding Astra choice; xhigh/max need a concrete reason. Keep parent model unchanged. Before spawning show ownership, role/task and actual pair (or inherited/unconfirmed). Use only valid explicit same-backend fallbacks; disclose actual substitutions, not unused candidates.
          Wait for meaningful events/results, not unchanged polling. One genuine no-progress timeout permits one takeover/replacement decision, not interrupt/reactivate loops. Report outcome, executionOwner (ChatGPT or Codex), artifacts, verification and limits. Plans, mocks and heartbeats are not completion; no per-tool ledger.
          '''
          common = textwrap.dedent(common).strip()+'\n'
          for name in ['qing-agent-orchestrator','qing-agent-orchestrator-full']:
              full = name.endswith('-full')
              prefix = 'runtime/' if full else ''
              schemas = '[Handoff schema]('+prefix+'schemas/handoff.schema.json) and [Review schema]('+prefix+'schemas/review.schema.json)'
              header = '---\nname: '+name+'\ndescription: Desktop-first Direct/Lite/Full orchestration with bounded delegation, minimal context, effect gates and evidence-based review. Use when Qing is invoked.\n---\n\n'
              content = header+common.replace('SCHEMA_LINKS',schemas)
              if full:
                  content += textwrap.dedent('''
          ## Optional process backend
          A documented process need alone justifies [execution-modes.md](references/execution-modes.md): CI, unattended scheduling, app-close persistence, machine-readable control, exclusive environment/model, isolation or explicit request. Show 建议切换 CLI 模式 and its benefit; obtain accept/decline before dependency checks. Decline continues desktop work without another prompt. Accept permits read-only doctor checks, not installation. Ready creates a fresh Full Handoff; real execution still requires --allow-real-execution and effect gates. Follow [codex-exec.md](references/codex-exec.md).
          Prefer --compact. Read logs with --after <last-sequence> --limit 20 --compact; retain nextAfter and honor hasMore, never treating a page as the full journal. Use models probe --candidate <id> for only the needed candidate; reuse cached health, --force only for explicit refresh. No routine all-model probes.
          ''')
              pathlib.Path('.agents/skills/'+name+'/SKILL.md').write_bytes(content.encode('utf-8'))
          # Keep current navigation current without rewriting historical release sections.
          for path in ['README.md','README.en.md']:
              p = pathlib.Path(path)
              s = p.read_text(encoding='utf-8')
              s = s.replace('[v0.8.1 发布说明](docs/release-notes-v0.8.1.md)', '[v0.9.0 发布说明](docs/release-notes-v0.9.0.md)')
              s = s.replace('[v0.8.1 release notes](docs/release-notes-v0.8.1.md)', '[v0.9.0 release notes](docs/release-notes-v0.9.0.md)')
              p.write_bytes(s.encode('utf-8'))
          # Unit tests cover helpers; also exercise the actual CLI wiring without a model call.
          tests = pathlib.Path('tests/astra-efficiency.test.ts')
          extra = '''
          import { NodeProcessRunner } from "../src/process-runner.js";
          test("CLI targeted disabled Astra probe never invokes an unrelated enabled candidate", async () => {
            const directory = await mkdtemp(join(tmpdir(), "qing-probe-target-"));
            try {
              const config = JSON.parse(await readFile("config/relay.example.json", "utf8"));
              config.executor.codexExec.command = "nonexistent-qing-probe-sentinel";
              const path = join(directory, "config.json");
              await writeFile(path, JSON.stringify(config));
              const runner = new NodeProcessRunner();
              const base = { command: process.execPath, cwd: process.cwd(), stdin: "", timeoutMs: 20000, maxOutputBytes: 100000 };
              const result = await runner.run({ ...base, args: ["dist/src/cli.js", "models", "probe", "--candidate", "cli-astra-demanding", "--config", path, "--compact"] });
              assert.equal(result.exitCode, 0, result.stderr);
              const output = JSON.parse(result.stdout);
              assert.equal(output.results.length, 1);
              assert.equal(output.results[0].candidateId, "cli-astra-demanding");
              assert.notEqual(output.results[0].state, "healthy");
              const invalid = await runner.run({ ...base, args: ["dist/src/cli.js", "models", "probe", "--candidate", "unknown-id", "--config", path] });
              assert.notEqual(invalid.exitCode, 0);
              assert.match(invalid.stderr, /configured Codex CLI candidate/);
            } finally { await rm(directory, { recursive: true, force: true }); }
          });
          '''
          tests.write_bytes((tests.read_text(encoding='utf-8')+'\n'+textwrap.dedent(extra)).encode('utf-8'))
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Run every regression test with bounded console output
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm test *> "$env:RUNNER_TEMP/qing-tests.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP/qing-tests.log" -Tail 150; throw 'Complete regression suite failed' }
          Get-Content "$env:RUNNER_TEMP/qing-tests.log" -Tail 10
      - name: Measure context bytes
        run: node scripts/measure-context-efficiency.mjs
      - name: Rebuild and validate both archives
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/astra-${{ github.run_id }}"
      - name: Commit verified changes and remove preparation helpers
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -ne 'codex/astra-efficiency-v0.9.0') { throw 'Unexpected branch' }
          git add -- src tests config/relay.example.json package.json package-lock.json .agents/skills artifacts docs CHANGELOG.md README.md README.en.md scripts/measure-context-efficiency.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git rm -- .github/workflows/prepare-astra-efficiency.yml .github/workflows/finalize-astra-efficiency.yml
          if ($LASTEXITCODE -ne 0) { throw 'Helper removal failed' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add opt-in Astra support and reduce redundant context, probes and log output for v0.9.0'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; no force push permitted' }

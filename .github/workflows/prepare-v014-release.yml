name: Prepare v0.14.0 release
on:
  push:
    branches: [release/v0.14.0]
    paths: [.github/workflows/prepare-v014-release.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'qingshihuan/qing-agent-orchestrator' && github.actor == 'qingshihuan'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - name: Synchronize release metadata without changing execution policy
        shell: python
        run: |
          import json, pathlib, subprocess
          baseline = 'b6931bec911fedd4fd2bc8d416598cdf35df694d'
          helper = '.github/workflows/prepare-v014-release.yml'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == baseline, 'Unexpected release baseline'
          assert subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines() == [helper]
          def read(path): return pathlib.Path(path).read_text(encoding='utf-8')
          def write(path, value): pathlib.Path(path).write_bytes(value.encode('utf-8'))
          def replace(path, old, new):
              value = read(path)
              assert value.count(old) == 1, f'Unexpected release document: {path}: {old[:70]}'
              write(path, value.replace(old, new, 1))
          package = json.loads(read('package.json'))
          lock = json.loads(read('package-lock.json'))
          assert package['version'] == lock['version'] == lock['packages']['']['version'] == '0.14.0-dev.1'
          package['version'] = lock['version'] = lock['packages']['']['version'] = '0.14.0'
          write('package.json', json.dumps(package, ensure_ascii=False, indent=2)+'\n')
          write('package-lock.json', json.dumps(lock, ensure_ascii=False, indent=2)+'\n')
          notes = '''# v0.14.0 — 单执行者架构发布

          本次按维护者要求发布已合并的单执行者架构，提供正式版本标签和可下载技能包。`execute-single` 仍为实验性、显式启用的运行路径；发行版本号不是性能或真实账户端到端验证的证明。

          ## 主要变化（相对 v0.13.0）
          - 默认只有一个完整实现负责人：当前父任务直接完成，或把整项实现、调试与约定测试转交一个执行器。关闭自动切片后父任务继续做大部分实现的路径。
          - 执行拓扑、独立审查、权限分开；多文件、跨模块、可并行或 CLI 传输本身不再强制 Full/Reviewer。真实高风险、明确要求和待决独立审查继续保留。
          - 新增 `execute-single` / `SingleOwnerController`。程序负责等待、固定验收与 Git 审计；控制器不调用管理模型，只启动一次 worker 适配器，不自动重试或运行时轮换模型。一次 worker 启动内部仍可能发生多次模型请求。
          - 在当前单执行器调用中关闭原生多智能体工具，不修改用户全局配置。原生技能只能约束调用行为，不能硬性限制宿主请求数。
          - 受保护规格和验收文件在测试前、测试之间和最终验收核对哈希；取消、篡改、未声明效果或失败不能报成功。同规范化工作区的合作式租约限制重复接管，不是 OS 沙箱。
          - `start` 默认生成本地任务合同骨架，不隐式调用付费 Planner；骨架须补具体验收命令后才可执行。已有显式接口保留。
          - 用量报告仅包含实际观察到的执行器 turn.completed 用量；turn 不等于模型 request。父任务、预检或失败用量不完整时，总费用与总请求数保持未知。

          ## 验证边界
          发布前及发布工作流执行完整 240 项自动化测试，并核对 Windows/Linux × Node.js 22/24/26、技能包内容、预编译运行时和解压 CLI。具体成功状态以该标签提交的 Actions 为准。
          自动化测试中的模型执行器为注入的模拟适配器；固定验收子进程、Git、租约和 CLI 控制路径实际运行。尚未完成用户账户的真实单执行器端到端验证，也未重跑六组模型性能基准。
          **没有已证实的整体提速、总 Token 或费用下降比例。** v0.13 的历史实验结论不被本次发布覆盖；同条件模型复验仍是后续效率结论的依据。

          ## 下载与升级
          - `qing-agent-orchestrator-standard.zip`：原生桌面技能，无 Node.js 依赖。
          - `qing-agent-orchestrator-full.zip`：相同原生能力及可选 Relay，运行时要求 Node.js 22 或更新版本；本次测试系列为 22/24/26，构建使用 24。
          - `SHA256SUMS.txt`：两个 ZIP 的 SHA-256。

          从 v0.13 升级时，两版技能都需要更新。备份定制配置，尤其是 `runtime/config/relay.user.json`；不要直接覆盖自定义设置。安装后新建会话加载技能。仓库发布不会更新本机安装。
          默认仍为 dry-run、inherit、真实执行关闭；GPT-6 Luna/Sol/Astra 配置、有效宿主权限和独立 Relay 的操作 gate 不变。`execute-single` 需要具体 Handoff、受保护的规格/验收输入、可审计 Git 工作区与既有真实执行授权；有独立审查义务时应使用保留的审查流程。

          详见 [单执行者架构及限制](single-owner.md)。v0.13.0 标签和附件不修改。

          English: this release distributes the single-owner architecture already merged in PR #19. The opt-in execute-single controller remains experimental. Software/package verification is not a connected-model speed, token or cost benchmark. Existing permissions, model defaults and prior releases are preserved.
          '''
          notes = '\n'.join(line[10:] if line.startswith('          ') else line for line in notes.splitlines()).strip()+'\n'
          write('docs/release-notes-v0.14.0.md', notes)
          replace('CHANGELOG.md', '当前稳定版本为 `v0.13.0`', '当前发布版本为 `v0.14.0`（单执行者控制器仍为实验性功能，性能收益尚未实测）')
          section = '''## 0.14.0 - 2026-09-24

          ### Changed

          - Publish the merged single-owner architecture and matching skill archives; keep execute-single explicitly experimental and opt-in.
          - Separate whole-task ownership, independent review and effective authorization; remove automatic parallel/slice team promotion.
          - Programmatic acceptance, protected inputs, cooperative workspace leases and qualified turn-usage reporting replace standing manager coordination in the new controller.
          - Preserve required review, real execution gates, model defaults and Node 22/24/26 coverage. No dependencies or runtime policy changed during release preparation.
          - No connected-model speed, token or cost improvement is claimed. See docs/release-notes-v0.14.0.md.

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          replace('CHANGELOG.md', '## 0.13.0 - 2026-09-23', section+'## 0.13.0 - 2026-09-23')
          old = '单执行者完成完整任务；执行拓扑、独立审查、权限分别判断。新增程序化 execute-single，不增加常驻管理模型。源码与仓库 ZIP 是待实测候选，稳定 Release 保持 v0.13.0；没有已实现的速度/费用节省比例。 See [architecture and limits](docs/single-owner.md).'
          replace('README.md', '## Experimental single-owner architecture (0.14.0-dev.1)', '## v0.14.0 — 单执行者架构')
          replace('README.md', old, '单执行者架构已提供 v0.14.0 下载：默认一个负责人完整完成任务，执行拓扑、独立审查和权限分别判断。新增的 execute-single 控制器仍为实验性、显式启用功能；尚未证明真实任务提速或省费。[发布说明](docs/release-notes-v0.14.0.md) · [架构与限制](docs/single-owner.md)')
          replace('README.md', '[v0.12.0 发布说明](docs/release-notes-v0.12.0.md)', '[v0.14.0 发布说明](docs/release-notes-v0.14.0.md)')
          replace('README.en.md', '## Experimental single-owner architecture (0.14.0-dev.1)', '## v0.14.0 — Single-owner architecture')
          replace('README.en.md', old, 'v0.14.0 distributes one complete implementation owner, with topology, independent review and authority decided separately. The opt-in execute-single controller remains experimental; connected-model speed, token and cost gains are not established. [Release notes](docs/release-notes-v0.14.0.md) · [Architecture and limits](docs/single-owner.md)')
          replace('README.en.md', '[v0.12.0 release notes](docs/release-notes-v0.12.0.md)', '[v0.14.0 release notes](docs/release-notes-v0.14.0.md)')
          replace('docs/single-owner.md', 'Source version 0.14.0-dev.1 and regenerated repository ZIPs are a frozen experimental candidate. The stable v0.13 Release is not replaced. A new stable release requires a separate connected experiment using identical frozen tasks/acceptance and recorded models/efforts/cache conditions. Main CI proves software behavior, not token/time savings.', 'At the maintainer\'s explicit release request, v0.14.0 now distributes the architecture previously merged as 0.14.0-dev.1. The execute-single controller remains experimental and opt-in. No connected experiment was added during publication, and no performance benefit is claimed. The unchanged v0.13 tag and assets remain available. Main CI proves software behavior, not token/time savings; efficiency conclusions still require identical frozen tasks/acceptance and recorded models/efforts/cache conditions.')
          # Publishing changes version metadata only; dependency resolution is frozen.
          base_lock = json.loads(subprocess.check_output(['git','show',baseline+':package-lock.json'],text=True))
          base_lock['version'] = base_lock['packages']['']['version'] = '0.14.0'
          assert lock == base_lock, 'Dependency changes are not part of this release'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Complete regression suite
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm test *> "$env:RUNNER_TEMP/qing-v014-tests.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/qing-v014-tests.log" -Tail 120; throw 'Full regression suite failed' }
          Get-Content "$env:RUNNER_TEMP/qing-v014-tests.log" -Tail 12
      - name: Rebuild and validate both release archives
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/v014-${{ github.run_id }}"
      - name: Smoke-test the exact packaged CLI
        run: python scripts/smoke-release-packages.py --expected-node 24
      - name: Verify scope and commit prepared release to this branch only
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -ne 'release/v0.14.0') { throw 'Unexpected target branch' }
          git diff --exit-code b6931bec911fedd4fd2bc8d416598cdf35df694d -- src tests schemas config .node-version scripts .agents/skills/qing-agent-orchestrator .agents/skills/qing-agent-orchestrator-full/SKILL.md .agents/skills/qing-agent-orchestrator-full/references .agents/skills/qing-agent-orchestrator-full/runtime/dist .agents/skills/qing-agent-orchestrator-full/runtime/config .github/workflows/release.yml
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected code, permission, dependency or build policy changes' }
          git add -- package.json package-lock.json CHANGELOG.md README.md README.en.md docs/single-owner.md docs/release-notes-v0.14.0.md .agents/skills/qing-agent-orchestrator-full/runtime/package.json artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git rm -- .github/workflows/prepare-v014-release.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary helper removal failed' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release v0.14.0 single-owner architecture with explicit experimental and benchmark boundaries'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed or branch moved; no force push permitted' }

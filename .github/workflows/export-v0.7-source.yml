name: Export v0.7 source workspace

on:
  push:
    branches:
      - feature/v0.7.0-efficiency

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf qing-v0.7-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: qing-v0.7-source
          path: qing-v0.7-source.tar.gz
          if-no-files-found: error
          retention-days: 1

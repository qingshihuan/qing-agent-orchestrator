name: Prepare Astra and context efficiency
on:
  push:
    branches: [codex/astra-efficiency-v0.9.0]
    paths: [.github/workflows/prepare-astra-efficiency.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'qingshihuan/qing-agent-orchestrator' && github.actor == 'qingshihuan'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped source, instruction and regression changes
        shell: python
        run: |
          import json, pathlib, subprocess
          root = pathlib.Path('.')
          baseline = 'b7317374fca396ec1f4959d1f250c876416cd49a'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == baseline
          def text(path): return pathlib.Path(path).read_text(encoding='utf-8')
          def write(path, value):
              p = pathlib.Path(path); p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(value.encode('utf-8'))
          def replace(path, old, new):
              value = text(path)
              assert value.count(old) == 1, f'Unexpected source structure: {path}: {old[:90]}'
              write(path, value.replace(old, new, 1))
          def append(path, value): write(path, text(path).rstrip() + '\n\n' + value.strip() + '\n')
          replace('src/executors/codex-exec-executor.ts', 'JSON.stringify(handoff, null, 2),', 'JSON.stringify(handoff),')
          replace('src/model-router.ts', 'const desktopCapabilities: Readonly<Record<string, readonly ModelReasoningEffort[]>> = {', '''// Recognized configuration pairs are not proof of this host/account's access.
          // Astra is opt-in; enable only after the host advertises the exact pair.
          const desktopCapabilities: Readonly<Record<string, readonly ModelReasoningEffort[]>> = {
            "gpt-6-astra": ["low", "medium", "high", "xhigh", "max"],''')
          helper = '''// Published compatibility floor; the local catalog may require a newer build.
          // https://help.openai.com/en/articles/20001275
          export function validateKnownModelMinimum(model: string, cliVersion: string): string | null {
            if (model !== "gpt-6-astra") return null;
            const actual = parseVersion(cliVersion);
            const minimum = parseVersion("0.153.0")!;
            if (!actual || compareVersions(actual, minimum) < 0) {
              return "Model 'gpt-6-astra' requires Codex CLI 0.153.0 or newer; installed version is " + cliVersion + ".";
            }
            return null;
          }

          '''
          replace('src/codex-model-catalog.ts', 'export function validateCandidateAgainstCatalog(', helper + 'export function validateCandidateAgainstCatalog(')
          replace('src/codex-model-catalog.ts', '  const entry = catalog.models.get(candidate.model);', '  const knownMinimum = validateKnownModelMinimum(candidate.model, cliVersion);\n  if (knownMinimum) return knownMinimum;\n  const entry = catalog.models.get(candidate.model);')
          replace('src/model-health.ts', 'parseCodexModelCatalog, validateCandidateAgainstCatalog, type CodexModelCatalog', 'parseCodexModelCatalog, validateCandidateAgainstCatalog, validateKnownModelMinimum, type CodexModelCatalog')
          replace('src/model-health.ts', 'async check(candidate: ModelCandidate): Promise<ModelHealthRecord>', 'async check(candidate: ModelCandidate, force = false): Promise<ModelHealthRecord>')
          replace('src/model-health.ts', '    const cliVersion = await this.cliVersion();', '    const cliVersion = await this.cliVersion();\n    const knownMinimum = validateKnownModelMinimum(candidate.model, cliVersion);\n    if (knownMinimum) return this.unverified(candidate.id, knownMinimum);')
          replace('src/model-health.ts', 'if (cached?.expiresAt && Date.parse(cached.expiresAt) > now)', 'if (!force && cached?.expiresAt && Date.parse(cached.expiresAt) > now)')
          write('src/output-efficiency.ts', '''/** Optional paging preserves the legacy unpaged response and complete journal. */
          export interface EventPageOptions { after: number; limit: number; }
          export function optionalFlag(args: readonly string[], name: string): string | undefined {
            const indices = args.flatMap((value, index) => value === name ? [index] : []);
            if (indices.length === 0) return undefined;
            if (indices.length !== 1) throw new Error(name + " must be supplied only once.");
            const value = args[indices[0]! + 1];
            if (!value || value.startsWith("--")) throw new Error(name + " requires a value.");
            return value;
          }
          export function logPageOptions(args: readonly string[]): EventPageOptions | null {
            const after = optionalFlag(args, "--after");
            const limit = optionalFlag(args, "--limit");
            if (after === undefined && limit === undefined) return null;
            const integer = (value: string, name: string): number => {
              if (!/^\\d+$/.test(value) || !Number.isSafeInteger(Number(value))) {
                throw new RangeError(name + " must be a non-negative safe integer.");
              }
              return Number(value);
            };
            const options = { after: integer(after ?? "0", "--after"), limit: integer(limit ?? "50", "--limit") };
            if (options.limit < 1 || options.limit > 500) throw new RangeError("--limit must be between 1 and 500.");
            return options;
          }
          export function selectEventPage<T extends { sequence: number }>(
            events: readonly T[], options: EventPageOptions,
          ): { events: T[]; nextAfter: number; hasMore: boolean } {
            if (!Number.isSafeInteger(options.after) || options.after < 0 ||
                !Number.isInteger(options.limit) || options.limit < 1 || options.limit > 500) {
              throw new RangeError("Invalid event page options.");
            }
            const selected: T[] = [];
            let previous = 0;
            let hasMore = false;
            for (const event of events) {
              if (!Number.isSafeInteger(event.sequence) || event.sequence <= previous) {
                throw new Error("Event sequences must be positive, unique and increasing.");
              }
              previous = event.sequence;
              if (event.sequence <= options.after) continue;
              if (selected.length < options.limit) selected.push(event);
              else hasMore = true;
            }
            return { events: selected, nextAfter: selected.at(-1)?.sequence ?? options.after, hasMore };
          }
          ''')
          replace('src/cli.ts', 'let compactMode = false;', 'let compactMode = false;')
          replace('src/cli.ts', 'import { classifyTask } from "./classifier.js";', 'import { classifyTask } from "./classifier.js";\nimport { logPageOptions, optionalFlag, selectEventPage } from "./output-efficiency.js";')
          replace('src/cli.ts', '    model: candidate.model,', '    candidateId: candidate.candidateId ?? null,\n    backend: candidate.backend ?? null,\n    profile: candidate.profile ?? null,\n    model: candidate.model,')
          replace('src/cli.ts', '    handoffId: source.handoffId ?? null,', '    handoffId: source.handoffId ?? null,\n    handoffPath: source.handoffPath ?? null,\n    plannerSource: source.plannerSource ?? null,\n    plannerWarning: source.plannerWarning ?? null,')
          replace('src/cli.ts', 'approval: gate ? { outcome: gate.outcome ?? null, gateIds } : { outcome: "ALLOW", gateIds: [] },', 'approval: gate ? { outcome: gate.outcome ?? null, gateIds, decisions: decisions.filter((item) => record(item)?.decision !== "ALLOW") } : { outcome: "ALLOW", gateIds: [], decisions: [] },')
          replace('src/cli.ts', '    const checker = new ModelHealthChecker({ command: config.executor.codexExec.command, cwd: runtimeRoot, schemaPath: resolve(runtimeRoot, "schemas/model-health.schema.json"), timeoutMs: config.modelRouting.probeTimeoutMs, ttlMs: config.modelRouting.healthTtlMs, ephemeral: config.executor.codexExec.ephemeral, ignoreUserConfig: config.executor.codexExec.ignoreUserConfig });', '''    const requestedCandidate = optionalFlag(args, "--candidate");
              if (requestedCandidate !== undefined && !config.modelRouting.candidates.some((item) => item.id === requestedCandidate && item.backend === "codex-cli")) {
                throw new Error("--candidate must name a configured Codex CLI candidate.");
              }
              const checker = new ModelHealthChecker({ command: config.executor.codexExec.command, cwd: runtimeRoot, schemaPath: resolve(runtimeRoot, "schemas/model-health.schema.json"), timeoutMs: config.modelRouting.probeTimeoutMs, ttlMs: config.modelRouting.healthTtlMs, ephemeral: config.executor.codexExec.ephemeral, ignoreUserConfig: config.executor.codexExec.ignoreUserConfig,
                cachePath: resolve(resolveStateDirectory(runtimeRoot, config.runtime.stateDirectory), "model-health-cache-v1.json"),
              });''')
          replace('src/cli.ts', 'const cliCandidates = config.modelRouting.candidates.filter(({ backend }) => backend === "codex-cli");', 'const cliCandidates = config.modelRouting.candidates.filter(({ id, backend }) => backend === "codex-cli" && (requestedCandidate === undefined || id === requestedCandidate));')
          replace('src/cli.ts', 'cliCandidates.map((candidate) => checker.check(candidate))', 'cliCandidates.map((candidate) => checker.check(candidate, args.includes("--force")))')
          replace('src/cli.ts', '    if (command === "logs") { print(await store.readEvents(runId)); return; }', '''    if (command === "logs") {
                const page = logPageOptions(args);
                const events = await store.readEvents(runId);
                print(page ? selectEventPage(events, page) : events);
                return;
              }''')
          replace('src/cli.ts', '    "doctor only checks CLI availability/authentication. It does not submit a task.",', '''    "doctor only checks CLI availability/authentication. It does not submit a task.",
              "Use --compact for agent-facing output; full output remains the compatibility default.",
              "models probe [--candidate <id>] [--force]: cached by default; force refreshes health.",
              "logs <run-id> [--after <sequence>] [--limit <1..500>]: returns events/nextAfter/hasMore; no flags retains the full array.",''')
          config = json.loads(text('config/relay.example.json'))
          for backend, prefix in [('desktop-child', 'desktop'), ('codex-cli', 'cli')]:
              template = next(c for c in config['modelRouting']['candidates'] if c['id'] == prefix + '-sol-complex')
              candidate = dict(template, id=prefix+'-astra-demanding', model='gpt-6-astra', reasoningEffort='high', enabled=False, priority=150, fallbacks=[template['id']])
              config['modelRouting']['candidates'].append(candidate)
          write('config/relay.example.json', json.dumps(config, ensure_ascii=False, indent=2)+'\n')
          # Short entry contracts retain gates; detailed references are loaded only as needed.
          common = '''Use the smallest sufficient tier for the **remaining phase**, on every new user turn and before child creation, reactivation, revision or review:
          - **Direct:** parent completes safe single-scope work; zero children, no model allocation, independent Reviewer or Handoff approval.
          - **Lite:** at most one Executor, targeted parent verification and one revision.
          - **Full:** structured Handoff, independent Reviewer, at most two children and one revision by default; only high-risk effects, cross-system scope, genuinely parallel work or explicit Full/Level 3 justify it. Explicit bounded configuration may override Full defaults.

          De-escalate Full → Lite → Direct as work narrows. Preserve pending independent-review obligations for unaccepted high-risk artifacts; restore Full at final acceptance. PARENT_ACTION_REQUIRED and PARENT_VERIFICATION_REQUIRED are not completion; Lite evidence never fabricates a Review.

          ## Load only what is needed
          Use this entry contract for clear Direct/Lite work; do not preload references or schemas. For ambiguous routing or Full, read [orchestrator-spec.md](references/orchestrator-spec.md). Before destructive, external, secret, global/system or uncertain effects, read [safety-gates.md](references/safety-gates.md); obtain the exact required approval before acting. Declared reversible in-scope edits/builds/tests need no separate plan approval. Preserve unrelated work and re-gate scope expansion.

          Full loads [handoff-protocol.md](references/handoff-protocol.md), [reviewer-rules.md](references/reviewer-rules.md) and the Handoff/Review schemas. Never skip required review or verification to save tokens.

          ## Work and context budget
          Do not create a child just to repeat exploration. Send only its objective, relevant files/ranges, constraints, acceptance criteria and required tests, not the chat transcript or entire repository. Revisions carry the unresolved findings and changed facts; retain the complete safety contract. Reuse verification only for the same unchanged inputs, commands and environment; retest affected work after edits and run required full checks before release.

          Choose the least costly capability-valid pair adequate for the role. Astra is opt-in for demanding delegated work, not the default for Direct/Lite; confirm the exact host-advertised pair. High reasoning is an initial demanding-work choice; xhigh/max require a concrete need, not a blanket default. Do not change the parent model. Before spawning show ownership, role/task and actual model/effort; use inherited/unconfirmed when unverified. Keep same-backend fallback plans internal and disclose only actual substitutions; changed scope requires a fresh gate.

          Wait for a meaningful child event or result, not repeated unchanged polling. One real no-progress timeout permits one takeover/replacement decision; no interrupt/reactivate loop. Report outcome, executionOwner (ChatGPT or Codex), changed artifacts, verification, limits and actual substitutions. A plan, mock or heartbeat is not completion; no per-tool ledger.
          '''
          common = '\n'.join(line[10:] if line.startswith('          ') else line for line in common.splitlines()).strip()+'\n'
          before_skills = {}
          for name in ['qing-agent-orchestrator', 'qing-agent-orchestrator-full']:
              path = '.agents/skills/'+name+'/SKILL.md'
              before_skills[name] = len(text(path).encode())
              description = 'Desktop-first Direct/Lite/Full orchestration with minimal context, bounded delegation, effect gates and evidence-based review. Use when Qing is invoked; keep ordinary safe work direct.'
              content = '---\nname: '+name+'\ndescription: '+description+'\n---\n\n# Qing\n\n'+common
              if name.endswith('-full'):
                  content += '''
          ## Optional process backend
          Only a documented backend need (CI, scheduling/unattended execution, app-close persistence, machine-readable control, exclusive environment/model, isolation or explicit request) justifies reading [execution-modes.md](references/execution-modes.md). Show 建议切换 CLI 模式 and its benefit; ask accept/decline before inspecting dependencies. Decline continues desktop-capable work without another prompt. Accept permits read-only doctor checks; installation/configuration changes remain gated. Ready creates a fresh Full Handoff. No recommendation or ready state starts execution; --allow-real-execution and effect gates remain required. Follow [codex-exec.md](references/codex-exec.md).

          Prefer --compact for agent-facing commands. Read logs with --after <last-sequence> --limit 20 --compact; retain nextAfter and honor hasMore. Never treat a page as the complete journal. Use models probe --candidate <id> only for the needed candidate; reuse the health cache and use --force only for an explicit refresh. Do not probe all models before routine tasks.
          '''
              content = '\n'.join(line[10:] if line.startswith('          ') else line for line in content.splitlines())+'\n'
              write(path, content)
          append('tests/model-health-persistent.test.ts', '''test("explicit force refresh bypasses health cache once and persists the new result", async () => {
            const directory = await mkdtemp(join(tmpdir(), "qing-force-health-"));
            try {
              const runner = new CacheProbeRunner();
              const checker = new ModelHealthChecker(cacheOptions(directory), runner);
              assert.equal((await checker.check(candidate)).state, "healthy");
              assert.equal((await checker.check(candidate)).cacheState, "cached");
              assert.equal(runner.calls.filter(args => args[0] === "exec").length, 1);
              assert.equal((await checker.check(candidate, true)).state, "healthy");
              assert.equal(runner.calls.filter(args => args[0] === "exec").length, 2);
              const cachedRunner = new VersionOnlyRunner();
              assert.equal((await new ModelHealthChecker(cacheOptions(directory), cachedRunner).check(candidate)).state, "healthy");
              assert.deepEqual(cachedRunner.calls, [["--version"]]);
            } finally { await rm(directory, { recursive: true, force: true }); }
          });''')
          write('tests/astra-efficiency.test.ts', '''import assert from "node:assert/strict";
          import test from "node:test";
          import { mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { buildCodexPrompt } from "../src/executors/codex-exec-executor.js";
          import { logPageOptions, optionalFlag, selectEventPage } from "../src/output-efficiency.js";
          import { supportedReasoningEfforts, validateModelCapability, selectModelCandidate } from "../src/model-router.js";
          import { parseCodexModelCatalog, validateCandidateAgainstCatalog, validateKnownModelMinimum } from "../src/codex-model-catalog.js";
          import { candidateFingerprint, ModelHealthChecker } from "../src/model-health.js";
          import { loadConfig } from "../src/config.js";
          import type { Handoff, ModelCandidate } from "../src/types.js";
          import type { ProcessRunner } from "../src/process-runner.js";
          const astra = { backend: "codex-cli", model: "gpt-6-astra", reasoningEffort: "high" } as const;
          const catalog = (minimum?: string) => parseCodexModelCatalog(JSON.stringify({ models: [{
            slug: astra.model, supported_reasoning_levels: [{ effort: "high" }], ...(minimum ? { minimal_client_version: minimum } : {}),
          }] }));
          test("Astra is recognized but still requires the declared desktop availability and valid effort", () => {
            assert.deepEqual(supportedReasoningEfforts("desktop-child", astra.model), ["low", "medium", "high", "xhigh", "max"]);
            const desktop = { ...astra, backend: "desktop-child", profile: null, availability: "host-advertised" } as const;
            assert.equal(validateModelCapability(desktop), null);
            assert.match(validateModelCapability({ ...desktop, reasoningEffort: "ultra" })!, /unsupported/);
            assert.match(validateModelCapability({ ...desktop, availability: "entitlement-dependent" })!, /host-advertised/);
            assert.match(validateModelCapability({ ...desktop, profile: "work" })!, /profiles/);
          });
          test("Astra rejects old, unknown and pre-release clients even if catalog omits its floor", () => {
            for (const version of ["codex-cli 0.152.0", "unknown", "codex-cli 0.153.0-alpha.1"]) {
              assert.match(validateCandidateAgainstCatalog(astra, catalog(), version)!, /0.153.0/);
            }
            assert.equal(validateCandidateAgainstCatalog(astra, catalog(), "codex-cli 0.153.0"), null);
            assert.equal(validateKnownModelMinimum("future-catalog-model", "unknown"), null);
          });
          test("Astra still obeys stricter local catalog versions and exact reasoning levels", () => {
            assert.match(validateCandidateAgainstCatalog(astra, catalog("0.154.0"), "0.153.0")!, /0.154.0/);
            assert.match(validateCandidateAgainstCatalog({ ...astra, reasoningEffort: "max" }, catalog(), "0.154.0")!, /unsupported/);
            assert.match(validateCandidateAgainstCatalog(astra, { models: new Map() }, "0.154.0")!, /absent/);
          });
          test("Astra is opt-in and does not silently upgrade ordinary or complex default selection", async () => {
            const config = await loadConfig("config/relay.example.json");
            const entries = config.modelRouting.candidates.filter(c => c.model === astra.model);
            assert.equal(entries.length, 2);
            assert.ok(entries.every(c => !c.enabled && c.reasoningEffort === "high" && !c.complexityBands.includes("normal")));
            const selected = selectModelCandidate(config.modelRouting.candidates, new Map(), { backend: "desktop-child", role: "executor", route: "codex", category: "code_change", complexityBand: "normal" });
            assert.equal(selected.model, "gpt-5.6-luna");
            const demanding = selectModelCandidate(config.modelRouting.candidates.map(c => c.id === "desktop-astra-demanding" ? { ...c, enabled: true } : c), new Map(), { backend: "desktop-child", role: "executor", route: "codex", category: "code_change", complexityBand: "complex" });
            assert.equal(demanding.model, astra.model);
          });
          test("an old-client cached Astra record cannot bypass the compatibility floor", async () => {
            const dir = await mkdtemp(join(tmpdir(), "qing-astra-min-"));
            try {
              const config = await loadConfig("config/relay.example.json");
              const candidate = { ...config.modelRouting.candidates.find(c => c.id === "cli-astra-demanding")!, enabled: true } as ModelCandidate;
              const version = "codex-cli 0.152.0";
              const cachePath = join(dir, "cache.json");
              await writeFile(cachePath, JSON.stringify({ version: "1.0", records: [{ candidateId: candidate.id, fingerprint: candidateFingerprint(candidate, version), cliVersion: version, state: "healthy", cacheState: "fresh", checkedAt: new Date().toISOString(), expiresAt: new Date(Date.now()+60000).toISOString(), failure: null, reason: "fixture" }] }));
              const calls: string[][] = [];
              const runner: ProcessRunner = { async run(request) { calls.push(request.args); assert.deepEqual(request.args, ["--version"]); return { exitCode: 0, signal: null, stdout: version, stderr: "", timedOut: false, outputLimitExceeded: false, spawnError: null }; } };
              const result = await new ModelHealthChecker({ command: "fixture", cwd: dir, cachePath, schemaPath: join(dir,"unused.json"), timeoutMs: 5000, ttlMs: 60000 }, runner).check(candidate);
              assert.notEqual(result.state, "healthy");
              assert.match(result.reason, /0.153.0/);
              assert.equal(calls.length, 1);
            } finally { await rm(dir, { recursive: true, force: true }); }
          });
          test("minified Executor context preserves the full contract and exact string values", async () => {
            const handoff = JSON.parse(await readFile("examples/game-visual-analyzer/handoff.json", "utf8")) as Handoff;
            handoff.constraints.push("保留  两个空格、中文及 emoji 🟦；不得扩大路径或权限");
            const context = { iteration: 2, revisionInstructions: ["仅修复失败断言，不重复已完成探索"] };
            const prompt = buildCodexPrompt(handoff, context);
            assert.deepEqual(JSON.parse(prompt.split("Handoff:\\n")[1]!), handoff);
            assert.ok(prompt.includes(JSON.stringify(context.revisionInstructions)));
            assert.ok(prompt.includes("complete current snapshot"));
            assert.ok(prompt.includes("proposedOperations for a new human gate"));
            assert.ok(Buffer.byteLength(JSON.stringify(handoff)) < Buffer.byteLength(JSON.stringify(handoff, null, 2)));
            assert.equal(buildCodexPrompt(handoff, context), prompt);
          });
          test("log paging defaults are opt-in and legacy output remains available", () => {
            assert.equal(logPageOptions(["logs", "id", "--compact"]), null);
            assert.deepEqual(logPageOptions(["--after", "4"]), { after: 4, limit: 50 });
            assert.deepEqual(logPageOptions(["--limit", "20"]), { after: 0, limit: 20 });
          });
          test("log and candidate flags reject missing, duplicate and invalid values", () => {
            assert.throws(() => optionalFlag(["--candidate"], "--candidate"));
            assert.throws(() => optionalFlag(["--candidate", "a", "--candidate", "b"], "--candidate"));
            for (const args of [["--after", "-1"], ["--after", "1.5"], ["--after", "9007199254740992"], ["--after", "--compact"], ["--limit", "0"], ["--limit", "501"]]) assert.throws(() => logPageOptions(args));
          });
          test("incremental pages preserve payloads and report every remaining event without duplication", () => {
            const events = [2,4,8,9].map(sequence => ({ sequence, payload: { error: "完整故障证据 🟦", phase: "review" } }));
            const first = selectEventPage(events, { after: 0, limit: 2 });
            assert.equal(first.hasMore, true); assert.equal(first.nextAfter, 4);
            const second = selectEventPage(events, { after: first.nextAfter, limit: 2 });
            assert.equal(second.hasMore, false); assert.equal(second.nextAfter, 9);
            assert.deepEqual([...first.events, ...second.events], events);
            assert.deepEqual(selectEventPage(events, { after: 9, limit: 2 }), { events: [], nextAfter: 9, hasMore: false });
          });
          test("paging refuses corrupt sequence order instead of silently skipping evidence", () => {
            for (const events of [[{ sequence: 2 }, { sequence: 1 }], [{ sequence: 1 }, { sequence: 1 }], [{ sequence: NaN }]]) assert.throws(() => selectEventPage(events, { after: 0, limit: 1 }));
            assert.throws(() => selectEventPage([], { after: -1, limit: 1 }));
          });
          test("bounded log pages materially reduce serialized repeated history", () => {
            const events = Array.from({ length: 200 }, (_, i) => ({ sequence: i+1, type: "process.heartbeat", payload: { iteration: 1, pid: 42, evidence: "fixture" } }));
            const page = selectEventPage(events, { after: 180, limit: 20 });
            assert.ok(Buffer.byteLength(JSON.stringify(page)) < Buffer.byteLength(JSON.stringify(events)) * 0.12);
            assert.equal(page.events.length, 20); assert.equal(page.hasMore, false);
          });
          test("entry skills keep gates while making reference loading conditional", async () => {
            for (const name of ["qing-agent-orchestrator", "qing-agent-orchestrator-full"]) {
              const source = await readFile(".agents/skills/"+name+"/SKILL.md", "utf8");
              assert.match(source, /do not preload references or schemas/);
              assert.match(source, /Never skip required review or verification/);
              assert.match(source, /Astra is opt-in/);
              assert.match(source, /same unchanged inputs, commands and environment/);
              assert.match(source, /pending independent-review obligations/);
            }
          });
          ''')
          package = json.loads(text('package.json'))
          assert package['version'] == '0.8.1'
          package['version'] = '0.9.0'
          package['scripts']['test'] += ' dist/tests/astra-efficiency.test.js'
          write('package.json', json.dumps(package, ensure_ascii=False, indent=2)+'\n')
          lock = json.loads(text('package-lock.json')); lock['version'] = lock['packages']['']['version'] = '0.9.0'
          write('package-lock.json', json.dumps(lock, ensure_ascii=False, indent=2)+'\n')
          # Both skills are shipped; keep their detailed reference snapshots consistent.
          for name in before_skills:
              append('.agents/skills/'+name+'/references/orchestrator-spec.md', '''## v0.9 context and model policy
          Load only the reference sections required by the current phase. Give a child a bounded objective, relevant paths, acceptance criteria and the unchanged safety contract, not the full conversation. Preserve required verification and independent review. Astra (`gpt-6-astra`) is an opt-in demanding-work candidate, not a blanket upgrade. A recognized model name is not proof of the current host's exact model/effort availability; confirm that pair before delegation. Do not infer desktop access from a public API model listing. Existing normal-task choices remain unchanged.''')
          notes = '''# v0.9.0 — Astra 按需适配与上下文降耗

          ## 新增与改进
          - 识别 `gpt-6-astra`；示例配置为桌面与进程后端各加入一个默认关闭的 demanding 候选，启用后使用 high 并保留显式同后端回退。普通任务不自动升级至 Astra。
          - Astra 最低 Codex CLI 0.153.0 在健康缓存命中前也会校验；实际模型目录可要求更高版本，仍需目录与账户健康预检。桌面配置表仅表示识别的参数，不代表已验证当前 host/账户可用。
          - Executor Handoff 使用无损紧凑 JSON；不删除目标、路径、约束、验收条件、测试或任何字符串内容。
          - 两版技能按阶段加载参考文档，禁止重复探索与整段聊天转交；保留效果审批、独立审查和最终验证。
          - `models probe --candidate <id>` 支持定向检查并默认复用持久缓存；`--force` 显式刷新健康结果。
          - `logs <id> --after <sequence> --limit <1..500>` 返回增量页、nextAfter 与 hasMore；完整日志和旧的无参数数组格式保留。底层仍读取现有日志，不声称降低磁盘扫描复杂度。
          - `--compact` 补回 Handoff 路径、规划警告、候选身份和需要批准/拒绝的完整决策。技能优先使用精简模式，命令的默认格式保持兼容。

          ## 升级
          下载 standard/full ZIP 与 SHA256SUMS.txt。本版本两版指令均有更新。升级前备份定制配置，尤其 runtime/config/relay.user.json。默认仍为 dry-run、inherit、真实执行关闭；不替换用户配置或自动启用 Astra。

          ## 证据边界
          字节数与探针次数是确定性代理指标，不是服务端计费 token、真实模型成功率或端到端加速比例。模型账户权限与桌面实际模型/档位需要运行环境验证。安全 gate、required testPlan、独立审查义务和编排预算没有放宽。

          官方核对（2026-09-08）：https://developers.openai.com/api/docs/models/gpt-6-astra 与 https://help.openai.com/en/articles/20001275 。公开模型参数不等于桌面或账户授权；CLI 目录与健康预检继续决定实际可用性。

          English: opt-in Astra support, lossless compact Executor context, conditional skill loading, cached targeted health probes and cursor-based log pages. Full evidence and legacy command shapes remain available. No measured connected-model speed or token-saving claim is made.
          '''
          write('docs/release-notes-v0.9.0.md', notes)
          changelog = text('CHANGELOG.md').replace('当前稳定版本为 `v0.8.1`', '当前稳定版本为 `v0.9.0`')
          write('CHANGELOG.md', changelog.replace('## 0.8.1 - ', '## 0.9.0 - 2026-09-08\n\n### Added / Changed\n\n- Astra opt-in candidates and minimum-client validation without bypassing availability checks.\n- Lossless compact Executor Handoff; conditional reference loading in both skill editions.\n- Targeted cached model probes with explicit force refresh; bounded incremental log output with cursors.\n- Compact control output retains approval decisions, Handoff paths and planner warnings.\n- Both archives rebuilt; evidence and safety boundaries preserved. See docs/release-notes-v0.9.0.md and docs/context-efficiency-measurements.json.\n\n## 0.8.1 - ', 1))
          for path, heading, summary in [
              ('README.md','## v0.9.0 提速降耗与 Astra','Astra 按需启用而非全局默认；紧凑执行上下文、分层读取规则、定向缓存预检和增量日志减少重复工作。完整验收和效果审批不变。'),
              ('README.en.md','## v0.9.0 Astra and context efficiency','Opt-in Astra, lossless compact context, conditional references, targeted cached probes and incremental logs reduce redundant work without weakening evidence or effect gates.')]:
              source = text(path)
              first, rest = source.split('\n',1)
              source = first+'\n\n'+heading+'\n\n'+summary+' See [v0.9.0](docs/release-notes-v0.9.0.md).\n'+rest
              write(path, source)
          append('docs/architecture.md', '''## v0.9 Astra and efficiency
          The desktop configuration table additionally recognizes gpt-6-astra with low/medium/high/xhigh/max, but does not prove the live host advertises any of those pairs. Astra example candidates are disabled until explicitly configured for demanding work. CLI requires at least 0.153.0 plus the current catalog and account health checks; a higher catalog floor wins. Compact JSON changes serialization only, not the executable Handoff. Incremental log pages preserve complete journal evidence and disclose hasMore; unpaged commands remain compatible. See release-notes-v0.9.0.md.''')
          append('docs/codex-integration.md', '''## v0.9 low-overhead operation
          Prefer `--compact` for agent-facing dispatch/start. Use `models probe --candidate cli-astra-demanding` only after enabling/configuring that candidate; health checks reuse the shared persistent cache. `--force` refreshes health explicitly, not on every task. Astra requires CLI 0.153.0 or newer, a matching local catalog and successful account preflight. No installation or login is performed automatically.
          `logs <run-id> --after 0 --limit 20 --compact` returns `{events,nextAfter,hasMore}`. Continue with nextAfter only when more evidence is needed; never mistake a partial page for the full journal. Without page flags the legacy full array remains available. Both ZIPs have updated instruction contracts; back up customized configuration before installing.''')
          # Reproducible transport metrics use real fixture data; no tokenizer claim.
          handoff = json.loads(text('examples/game-visual-analyzer/handoff.json'))
          write('scripts/measure-context-efficiency.mjs', '''import { readFileSync, writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { selectEventPage } from "../dist/src/output-efficiency.js";
          const baseline = "b7317374fca396ec1f4959d1f250c876416cd49a";
          const handoff = JSON.parse(readFileSync("examples/game-visual-analyzer/handoff.json", "utf8"));
          const bytes = value => Buffer.byteLength(value, "utf8");
          const normalized = value => value.replace(/\\r\\n/g, "\\n");
          const events = Array.from({length:200},(_,i)=>({sequence:i+1,type:"process.heartbeat",payload:{iteration:1,pid:42,evidence:"synthetic-fixture"}}));
          const metrics = {
            baseline, units:"UTF-8 bytes; not billed tokens or end-to-end latency", node:process.version,
            executorHandoff:{before:bytes(JSON.stringify(handoff,null,2)),after:bytes(JSON.stringify(handoff)),lossless:JSON.stringify(JSON.parse(JSON.stringify(handoff)))===JSON.stringify(handoff)},
            logPage:{historyEvents:200,returnedEvents:20,before:bytes(JSON.stringify(events)),after:bytes(JSON.stringify(selectEventPage(events,{after:180,limit:20})))},
            skills:Object.fromEntries(["qing-agent-orchestrator","qing-agent-orchestrator-full"].map(name=>{
              const path=".agents/skills/"+name+"/SKILL.md";
              return [name,{before:bytes(normalized(execFileSync("git",["show",baseline+":"+path],{encoding:"utf8"}))),after:bytes(normalized(readFileSync(path,"utf8")))}];
            })),
            limits:["No connected model calls or billed-token measurement","Log paging does not optimize disk scanning","Conditional reference loading is an instruction policy, not an enforced host token cap"]
          };
          writeFileSync("docs/context-efficiency-measurements.json",JSON.stringify(metrics,null,2)+"\\n");
          console.log(JSON.stringify(metrics,null,2));
          ''')
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Full regression suite
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm test
      - name: Measure transport and instruction sizes
        run: node scripts/measure-context-efficiency.mjs
      - name: Rebuild and validate both skill editions
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/astra-${{ github.run_id }}"
      - name: Commit validated source and packages to this branch only
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -ne 'codex/astra-efficiency-v0.9.0') { throw 'Unexpected branch' }
          git add -- src tests config/relay.example.json package.json package-lock.json .agents/skills artifacts docs CHANGELOG.md README.md README.en.md scripts/measure-context-efficiency.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git rm -- .github/workflows/prepare-astra-efficiency.yml
          if ($LASTEXITCODE -ne 0) { throw 'Helper removal failed' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add opt-in Astra and reduce redundant context, health probes and log output for v0.9.0'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Branch moved; no force push permitted' }

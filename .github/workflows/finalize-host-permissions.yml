name: Finalize host permission contracts
on:
  push:
    branches: [codex/host-permissions-v0.11.0]
    paths: [.github/workflows/finalize-host-permissions.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'qingshihuan/qing-agent-orchestrator' && github.actor == 'qingshihuan'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply final reviewed contract fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess,textwrap
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == '1e537c7478459ebd8e7406450d0bd445534ce2a9'
          def replace(path,old,new):
              p=Path(path);s=p.read_text(encoding='utf-8')
              assert s.count(old)==1,(path,old,s.count(old))
              p.write_bytes(s.replace(old,new,1).encode('utf-8'))
          replace('src/cli.ts','if (!cliResponse && args.includes("--no-model-probe")) {','if (cliResponse !== "decline" && args.includes("--no-model-probe")) {')
          replace('src/cli.ts','Continue with host-permitted read-only checks using --cli-response auto when appropriate;', 'Remove --no-model-probe to continue with host-permitted read-only checks using --cli-response auto when appropriate;')
          replace('.agents/skills/qing-agent-orchestrator-full/SKILL.md','--cli-response auto continues the read-only check without a second user-choice round.', 'Remove --no-model-probe and use --cli-response auto to continue the read-only check without a second user-choice round; auto/accept never override the no-probe flag.')
          replace('.agents/skills/qing-agent-orchestrator-full/references/execution-modes.md','the host driver can continue with `--cli-response auto` under its existing permissions.', 'the host driver can remove that flag and continue with `--cli-response auto` under its existing permissions. The no-probe flag wins over auto/accept; decline still returns to native work without inspecting anything.')
          replace('docs/host-permissions.md','宿主驱动可直接用 `--cli-response auto` 继续。', '宿主驱动可移除 `--no-model-probe` 后用 `--cli-response auto` 继续；保留 no-probe 时 auto/accept 都不能触发检查。')
          replace('docs/codex-integration.md','--cli-response auto 可由宿主驱动继续；', '移除该标志后 --cli-response auto 可由宿主驱动继续；保留 no-probe 时 auto/accept 都不触发检查；')
          replace('README.en.md','Optional, only after an explicit reason and user acceptance','Automatically selected for a documented need; actual host/task authorization still applies')
          replace('README.en.md','Code, complexity, and duration alone do not trigger it. Declining returns to desktop execution and suppresses repeated prompts. Accepting starts only a read-only dependency check; installation/configuration and consequential real effects remain gated, while safe work needs no extra Handoff approval.', 'Code, complexity, and duration alone do not trigger it. Qing decides the route without a separate accept/decline question. An explicit refusal returns to native work and suppresses repeated prompts. Automatic routing may perform host-permitted read-only dependency checks, never installation, login or task execution. --no-model-probe prevents discovery/planning even with auto/accept. Actual missing scope/permission is handled once through the host; standalone Relay gates remain separate.')
          replace('README.en.md','## Safety and evidence\n','## Safety and evidence\n\nNative calls use effective host permissions and exact task authorization, without a second Qing gate-ID prompt. The following exact network allowlist and gate rules apply to the standalone Relay, not as duplicate dialogs on native subagents. Raw TOML, a screenshot or a generated Handoff cannot grant process authorization.\n')
          replace('README.en.md','Goal: review the login flow, implement the safe in-scope fix, and run the tests; pause only if a consequential effect is needed.','Goal: automatically choose the right workflow, fix the in-scope login issue and run the tests under current host permissions; do not repeat existing scoped authorizations.')
          p=Path('tests/host-permissions.test.ts')
          extra='''
          test("no-probe dominates auto/accept overrides without manufacturing an accepted action",async()=>{
            await inFixture(async(directory,config)=>{
              for(const override of ["auto","accept"]){
                const result=await cli(directory,config,["dispatch","--task","使用 CLI 完成工程任务","--workspace",directory,"--no-model-probe","--cli-response",override,"--compact"]);
                assert.equal(result.exitCode,0,result.stderr);
                const response=JSON.parse(result.stdout);
                assert.equal(response.status,"CLI_DEPENDENCY_CHECK_REQUIRED");
                assert.equal(response.modelProbe,"not-started");
                assert.equal(response.cliRecommendation.dependencyStatus,"not-checked");
                assert.equal(response.handoffId,null);
              }
            });
          });
          test("explicit decline with no-probe continues native work rather than asking a routing question",async()=>{
            await inFixture(async(directory,config)=>{
              const result=await cli(directory,config,["dispatch","--task","把它接入 GitHub Actions CI","--workspace",directory,"--no-model-probe","--cli-response","decline","--compact"]);
              assert.equal(result.exitCode,0,result.stderr);
              const response=JSON.parse(result.stdout);
              assert.equal(response.executionMode,"desktop-fallback");
              assert.equal(response.cliRecommendation.response,"declined");
              assert.equal(response.modelProbe,"not-applicable");
              assert.equal(response.permissionHandling.grantsPermissions,false);
            });
          });
          '''
          p.write_bytes((p.read_text(encoding='utf-8')+'\n'+textwrap.dedent(extra)).encode('utf-8'))
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Complete regression suite
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm test *> "$env:RUNNER_TEMP/host-permission-final-tests.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path "$env:RUNNER_TEMP/host-permission-final-tests.log" -Pattern '^not ok' -Context 1,45
            throw 'Full regression suite failed'
          }
          Get-Content "$env:RUNNER_TEMP/host-permission-final-tests.log" -Tail 12
      - name: Rebuild and validate packages
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/host-final-${{ github.run_id }}"
      - name: Commit verified changes to the branch only
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if ($env:TARGET_BRANCH -ne 'codex/host-permissions-v0.11.0') { throw 'Unexpected branch' }
          git add -- src tests .agents/skills artifacts docs README.en.md
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git rm -- .github/workflows/finalize-host-permissions.yml
          if ($LASTEXITCODE -ne 0) { throw 'Helper removal failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve explicit no-probe boundaries and document host approval reuse consistently'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; no force push permitted' }

name: Prepare single-owner architecture
on:
  push:
    branches: [codex/single-owner-v0.14]
    paths:
      - .github/maintenance/single-owner.py
      - .github/maintenance/refine-single-owner.py
      - .github/maintenance/finalize-single-owner.py
      - .github/workflows/prepare-single-owner.yml
permissions:
  contents: read
concurrency:
  group: single-owner-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'qingshihuan/qing-agent-orchestrator' && github.actor == 'qingshihuan'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - name: Apply the previously typechecked transformations and final cancellation fix
        shell: python
        run: |
          import subprocess, textwrap
          from pathlib import Path
          ref='e0a5e0f12223bae85247c792f5213b87a5f98f54'
          subprocess.run(['git','merge-base','--is-ancestor',ref,'HEAD'],check=True)
          source=subprocess.check_output(['git','show',ref+':.github/workflows/prepare-single-owner.yml'],text=True,encoding='utf-8')
          marker='      - name: Apply guarded single-owner transformations\n        shell: python\n        run: |\n'
          assert source.count(marker)==1
          code=textwrap.dedent(source.split(marker,1)[1].split('      - run: npm ci --ignore-scripts',1)[0])
          exec(compile(code,'typechecked-single-owner-preparation','exec'),{})
          exec(compile(Path('.github/maintenance/finalize-single-owner.py').read_text(encoding='utf-8'),'terminal-cancellation-fix','exec'),{})
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Complete regression suite
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm test *> "$env:RUNNER_TEMP/qing-single-owner-tests.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP/qing-single-owner-tests.log" -Tail 120; throw 'Complete suite failed; no generated source is pushed' }
          Get-Content "$env:RUNNER_TEMP/qing-single-owner-tests.log" -Tail 12
      - name: Rebuild and validate both skill editions
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/single-${{ github.run_id }}"
      - run: python scripts/smoke-release-packages.py --expected-node 24
      - name: Verify unchanged authorization and dependency boundaries
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          base='1f15789a3a789a4a3833127e0538d6535f9793f1'
          paths=['config','schemas','src/safety-gate.ts','src/native-permissions.ts','src/sandbox-preflight.ts']
          subprocess.run(['git','diff','--exit-code','--ignore-cr-at-eol',base,'--',*paths],check=True)
          old=json.loads(subprocess.check_output(['git','show',base+':package-lock.json'],text=True))
          new=json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          assert {k:v for k,v in old['packages'].items() if k} == {k:v for k,v in new['packages'].items() if k}
          assert new['version']=='0.14.0-dev.1'
          assert "publish == 'true'" in Path('.github/workflows/release.yml').read_text(encoding='utf-8')
      - name: Publish validated source to this branch only
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          if ($env:TARGET_BRANCH -ne 'codex/single-owner-v0.14' -or (git rev-parse HEAD).Trim() -ne $env:EXPECTED_HEAD) { throw 'Unexpected branch/revision' }
          git add -- src tests package.json package-lock.json .agents/skills artifacts docs README.md README.en.md CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git rm -- .github/maintenance/single-owner.py .github/maintenance/refine-single-owner.py .github/maintenance/finalize-single-owner.py .github/workflows/prepare-single-owner.yml
          if ($LASTEXITCODE -ne 0) { throw 'Helper removal failed' }
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement single-owner execution, orthogonal review policy and protected programmatic acceptance'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; do not force-push' }

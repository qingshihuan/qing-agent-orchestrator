name: Refresh generated artifacts for routing precision branch

on:
  push:
    branches:
      - fix/v0.6.1-routing-efficiency

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.1-routing-efficiency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Regenerate runtime and deterministic archives
        shell: pwsh
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/refresh-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Commit generated files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist .agents/skills/qing-agent-orchestrator-full/runtime artifacts
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: refresh generated routing artifacts"
            git push origin HEAD:fix/v0.6.1-routing-efficiency
          }

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Run tests with a canonical temporary root
        env:
          # Avoid Windows 8.3 short-path aliases (for example RUNNER~1) in
          # temporary fixtures while retaining GitHub's managed temp root.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm test

  package-skill:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve committed archives for semantic comparison
        shell: pwsh
        run: Copy-Item -LiteralPath artifacts -Destination "${{ runner.temp }}/committed-artifacts" -Recurse
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Rebuild and validate installable skill archives
        shell: pwsh
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/ci-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify committed archives contain the current package tree
        shell: pwsh
        run: ./scripts/compare-skill-archives.ps1 -CommittedRoot "${{ runner.temp }}/committed-artifacts" -GeneratedRoot artifacts -ScratchRoot "${{ runner.temp }}/qing-archive-compare-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload generated runtime and archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-skill-tree
          path: |
            .agents/skills/qing-agent-orchestrator-full/runtime
            artifacts
          if-no-files-found: error
          retention-days: 3
      - name: Verify generated runtime is committed
        shell: pwsh
        run: |
          $runtimePath = ".agents/skills/qing-agent-orchestrator-full/runtime"
          $changed = @(git diff --ignore-cr-at-eol --name-only -- $runtimePath)
          $untracked = @(git ls-files --others --exclude-standard -- $runtimePath)
          if ($changed.Count -ne 0 -or $untracked.Count -ne 0) {
            if ($changed.Count -ne 0) {
              Write-Host "Tracked runtime drift:"
              $changed | ForEach-Object { Write-Host $_ }
              git diff --ignore-cr-at-eol -- $runtimePath
            }
            if ($untracked.Count -ne 0) {
              Write-Host "Untracked runtime files:"
              $untracked | ForEach-Object { Write-Host $_ }
            }
            throw "The committed full-skill runtime is out of date."
          }

  prepare-v0-5-0:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/release/v0.5.0' &&
       !contains(github.event.head_commit.message, '[release-prep]')) ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'release/v0.5.0')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute the guarded release transformation
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath .github/workflows/prepare-v0.5.0.yml -Encoding utf8)
          $start = -1
          $end = -1
          for ($index = 0; $index -lt $lines.Count; $index += 1) {
            if ($start -lt 0 -and $lines[$index].Trim() -eq "@'") { $start = $index; continue }
            if ($start -ge 0 -and $lines[$index].Trim() -eq "'@ | python -") { $end = $index; break }
          }
          if ($start -lt 0 -or $end -le $start) { throw "Could not locate the guarded Python release transformation." }
          $sourceLines = @($lines[($start + 1)..($end - 1)])
          $firstCodeLine = $sourceLines | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -First 1
          if ($null -eq $firstCodeLine) { throw "The guarded Python release transformation is empty." }
          $baseIndent = $firstCodeLine.Length - $firstCodeLine.TrimStart().Length
          if ($baseIndent -le 0) { throw "The guarded Python release transformation has no YAML base indent." }
          $prefix = " " * $baseIndent
          $dedented = @($sourceLines | ForEach-Object {
            if ($_.StartsWith($prefix)) { $_.Substring($baseIndent) } else { $_ }
          })
          $scriptText = ($dedented -join "`n") + "`n"
          $scriptText = $scriptText.Replace("if count != 1:", "if count < 1:")
          $scriptText = $scriptText.Replace("expected exactly one match", "expected at least one match")
          $scriptText = $scriptText.Replace("return value.replace(old, new, 1)", "return value.replace(old, new)")
          $scriptPath = Join-Path $env:RUNNER_TEMP "prepare-v0.5.0.py"
          [System.IO.File]::WriteAllText($scriptPath, $scriptText, [System.Text.UTF8Encoding]::new($false))
          python $scriptPath
      - run: npm ci --ignore-scripts
      - name: Typecheck and test prepared source
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          npm run typecheck
          npm test
      - name: Build and validate prepared packages
        shell: pwsh
        run: ./scripts/package-skill-editions.ps1 -Validate -ValidationRoot ".qing/package-validation/prepare-ci-${{ github.run_id }}"
      - name: Commit prepared release files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json CHANGELOG.md README.md README.en.md docs/release-notes-v0.5.0.md .agents/skills/qing-agent-orchestrator-full/runtime artifacts
          if (git diff --cached --quiet) {
            Write-Host "Release files are already prepared."
            exit 0
          }
          git commit -m "release: prepare v0.5.0 [release-prep]"
          git push origin HEAD:release/v0.5.0
